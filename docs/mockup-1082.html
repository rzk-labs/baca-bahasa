<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1082 Tab Kata</title>
<style>
body{margin:0;background:#e9e4da;font-family:Inter,system-ui,sans-serif;color:#351E28;padding:16px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.col{width:390px}.lbl{font:700 12px/16px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;color:#5F5059}
.ph{width:390px;box-sizing:border-box;background:#D7EFFF;border-radius:24px;padding:16px;min-height:560px}
h1{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;font-size:28px;margin:6px 2px 12px}
h1 span{background:#E9F056;padding:0 6px;border-radius:8px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.sum div{background:#FAF7F0;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px}.sum b{display:block;font-size:20px}
.seg{display:flex;background:#C3E1F4;border-radius:999px;padding:3px;margin-bottom:16px}.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:999px;font:600 13px Inter;color:#351E28}.seg .on{background:#351E28;color:#FAF7F0}
.empty{text-align:center;background:#FAF7F0;border-radius:20px;padding:32px 16px}.empty h2{margin:0 0 6px;font-size:20px}.empty p{margin:0 auto;max-width:30ch;font-size:14px;line-height:21px;color:#5F5059}
.pri{margin-top:16px;min-width:200px;min-height:44px;border:0;border-radius:999px;background:#351E28;color:#FAF7F0;font:600 15px Inter}
</style></head><body>
<div class="col"><p class="lbl">Kondisi 1 · Tab Kata kosong</p><div class="ph"><h1>Kata <span>kamu</span></h1>
<div class="sum"><div><b>0</b>Disimpan</div><div><b>0</b>Lagi dihafal</div><div><b>0</b>Udah hafal</div><div><b>0</b>Susah diucap</div></div>
<div class="seg"><button>Kartu</button><button class="on">Tersimpan</button><button>Susah diucap</button></div>
<div class="empty"><h2>Belum ada kata</h2><p>Ketuk kata di bacaan → Simpan, nanti muncul di sini.</p><button class="pri">Mulai baca</button></div></div></div>
<div class="col"><p class="lbl">Kondisi 2 · Tab Kata gagal tampil</p><div class="ph"><h1>Kata <span>kamu</span></h1>
<div class="empty"><h2>Tab Kata lagi bermasalah</h2><p>Coba muat ulang. Kata simpananmu aman kok.</p><button class="pri">Muat ulang</button></div></div></div>
</body></html>

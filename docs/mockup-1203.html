<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1203: nada pinyin</title>
<style>
body{margin:0;padding:16px;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:12px auto 6px;width:390px;box-sizing:border-box}
.ph{width:390px;box-sizing:border-box;margin:0 auto 18px;background:#FAF7F0;border-radius:24px;padding:20px 16px;text-align:center}
.card{background:#C3E1F4;border:2px solid #A9CCE2;border-radius:24px;padding:24px 14px}
.w{font:800 44px "Bricolage Grotesque",Inter,sans-serif}.ft{font-size:18px;margin-top:6px}
.fb{font-weight:700;font-size:20px;margin-top:8px}
.pt{text-underline-offset:4px;text-decoration-thickness:2px}
.t1{color:#A52A1F;text-decoration:underline solid}.t2{color:#1E6B24;text-decoration:underline dashed}.t3{color:#1853A8;text-decoration:underline wavy;text-decoration-thickness:1.5px}.t4{color:#7B3FA0;text-decoration:underline solid;text-decoration-thickness:4px}.t5{color:#5F5059}
.nlg{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;margin-top:6px;font-size:12px;color:#4A3A42}.nlg .pt{font-weight:700}
.b{min-height:44px;padding:0 10px;font-size:12px;background:none;border:0;color:#4A3A42;text-decoration:underline}
</style></head><body>
<div class="lbl">Sebelum: cuma warna</div>
<div class="ph"><div class="card"><div class="w">你好吗</div><div class="ft">apa kabar?</div>
<div class="fb"><span style="color:#C0392B">nǐ</span> <span style="color:#2E7D32">hǎo</span> <span style="color:#5F5059">ma</span></div></div></div>
<div class="lbl">Sesudah: garis bawah + legenda</div>
<div class="ph"><div class="card"><div class="w">你好吗</div><div class="ft">apa kabar?</div>
<div class="fb"><span class="pt t3">nǐ</span> <span class="pt t3">hǎo</span> <span class="pt t5">ma</span></div>
<div class="nlg">Nada: <span class="pt t1">1</span> datar · <span class="pt t2">2</span> naik · <span class="pt t3">3</span> turun-naik · <span class="pt t4">4</span> turun</div>
<button class="b" type="button">Tutup</button></div></div>
<div class="lbl">Sesudah: legenda ditutup</div>
<div class="ph"><div class="card"><div class="w">妈妈</div><div class="ft">ibu</div>
<div class="fb"><span class="pt t1">mā</span> <span class="pt t1">ma</span></div>
<button class="b" type="button">Lihat arti nada</button></div></div>
</body></html>

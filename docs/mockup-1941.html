<!doctype html>

<title>Mockup #1941: layar terakhir tak kosong</title>
<style>
body{margin:0;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;padding:24px}

.card{margin:0 24px 16px;text-align:center}
.card button{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid #351E28;background:#fff;color:#351E28;font:600 15px Inter,sans-serif;margin-bottom:8px}

.bar i{flex:1;height:6px;border-radius:3px;background:#e3dcd4;position:relative}
.bar i b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#E9F056;border-radius:3px}
.fin{background:#351E28;color:#fff;border-radius:999px;padding:8px 16px;font-weight:600}

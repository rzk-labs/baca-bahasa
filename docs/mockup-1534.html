<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Mockup #1534 — ringkasan HSK di tab Kata</title>
<style>
body{margin:0;background:#eee;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{font-size:12px;text-align:center;padding:8px;color:#666}
.ph{width:390px;margin:0 auto 16px;background:#fff;padding:16px;box-sizing:border-box;min-height:360px}
h2{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:22px;margin:0 0 12px}
.fchips{display:flex;gap:6px;margin:0 0 10px}
.fchip{flex:1;height:34px;border-radius:999px;border:1px solid #D7EFFF;background:#fff;font-size:13px;color:#351E28}
.fchip.on{background:#351E28;color:#fff}
.hsksum{display:flex;gap:2px;margin:-4px 0 10px;font-size:12px;line-height:18px;white-space:nowrap}
.hs{padding:4px 6px;border-radius:999px}.hs.on{background:#D7EFFF}
.vitem{border-top:1px solid #eee;padding:10px 0}.w1{font-size:20px;font-weight:700}.t1{font-size:14px}
.hskc{font-size:12px;background:#D7EFFF;border-radius:999px;padding:1px 8px;font-weight:700}
</style></head><body>
<div class="lbl">Sesudah (tab Kata &gt; Tersimpan, buku zh-CN)</div>
<div class="ph"><h2>Kata</h2>
<div class="fchips"><span class="fchip on" style="line-height:34px;text-align:center">Semua</span><span class="fchip" style="line-height:34px;text-align:center">HSK 1</span><span class="fchip" style="line-height:34px;text-align:center">HSK 2</span></div>
<div class="hsksum"><span class="hs">HSK 1: <b>12</b>/150</span><span class="hs">HSK 2: <b>5</b>/150</span></div>
<div class="vitem"><div class="w1">你好</div><div class="t1">halo</div><span class="hskc">HSK 1</span></div>
<div class="vitem"><div class="w1">朋友</div><div class="t1">teman</div><span class="hskc">HSK 1</span></div></div>
<div class="lbl">Sesudah, HSK 1 dipilih (ketuk ringkasan = ketuk chip)</div>
<div class="ph"><h2>Kata</h2>
<div class="fchips"><span class="fchip" style="line-height:34px;text-align:center">Semua</span><span class="fchip on" style="line-height:34px;text-align:center">HSK 1</span><span class="fchip" style="line-height:34px;text-align:center">HSK 2</span></div>
<div class="hsksum"><span class="hs on">HSK 1: <b>12</b>/150</span><span class="hs">HSK 2: <b>5</b>/150</span></div>
<div class="vitem"><div class="w1">你好</div><div class="t1">halo</div><span class="hskc">HSK 1</span></div></div>
</body></html>

<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1666 — Kartu Minggu ini, ringkas</title>
<style>
body{margin:0;padding:16px;background:#e9e4da;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{max-width:390px;margin:0 auto 6px;font:700 12px/16px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.ph{width:390px;margin:0 auto 24px;background:#FAF7F0;border-radius:24px;padding:16px;box-sizing:border-box}
h1{font:800 22px/28px "Bricolage Grotesque",Inter,sans-serif;margin:4px 0 12px}
.card{background:#fff;border:1px solid rgba(53,30,40,.12);border-radius:20px;margin:0 0 12px}
.wk{padding:2px 6px 2px 14px}
.wk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-t{font-weight:700;font-size:14px}
.wk-g{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.wk-c{font-size:12px;line-height:16px;padding:4px 8px;border-radius:999px;background:rgba(127,127,127,.14);color:#6b5a62;white-space:nowrap}
.wk-c b{font-size:13px;color:#351E28}
.wk-n{flex-basis:100%;font-size:12px;line-height:16px;color:#6b5a62}
.wk-x{min-height:44px;min-width:44px;padding:0 6px;font-size:12px;background:none;border:0;color:#6b5a62;margin-left:auto}
.tile{background:#E9F056;border-radius:24px;padding:18px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase}
.big{font:800 40px/44px "Bricolage Grotesque",Inter,sans-serif}.big small{font:500 14px Inter}
.dots{display:flex;justify-content:space-between;margin:10px 0 6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.sd i{width:20px;height:20px;border-radius:50%;background:#351E28;display:block}
.sd i.e{background:transparent;box-shadow:inset 0 0 0 2px rgba(53,30,40,.35)}
</style></head><body>
<div class="lbl">Sebelum</div>
<div class="ph"><h1>Beranda</h1>
<div class="card wk"><div class="wk-h"><span class="wk-t">Minggu ini</span><div class="wk-g"><span class="wk-c"><b>12</b> halaman</span><span class="wk-c"><b>8</b> kata baru</span><span class="wk-c">Hari baca <b>7</b> dari 7 hari</span></div><div class="wk-n">Streak = beruntun. Hari baca = total 7 hari.</div><button class="wk-x">Sembunyikan</button></div></div>
<div class="tile"><div class="eyebrow">Streak</div><div class="big">7 <small>hari</small></div>
<div class="dots"><span class="sd"><i class="e"></i>Sen</span><span class="sd"><i class="e"></i>Sel</span><span class="sd"><i class="e"></i>Rab</span><span class="sd"><i class="e"></i>Kam</span><span class="sd"><i class="e"></i>Jum</span><span class="sd"><i class="e"></i>Sab</span><span class="sd"><i class="e"></i>Min</span></div>Rekor barumu!</div></div>

<div class="lbl">Sesudah</div>
<div class="ph"><h1>Beranda</h1>
<div class="card wk"><div class="wk-h"><span class="wk-t">Minggu ini</span><div class="wk-g"><span class="wk-c"><b>12</b> halaman</span><span class="wk-c"><b>8</b> kata baru</span><span class="wk-c">Hari baca <b>7/7</b></span></div><button class="wk-x">Sembunyikan</button></div></div>
<div class="tile"><div class="eyebrow">Streak</div><div class="big">7 <small>hari</small></div>
<div class="dots"><span class="sd"><i></i>Sen</span><span class="sd"><i></i>Sel</span><span class="sd"><i></i>Rab</span><span class="sd"><i></i>Kam</span><span class="sd"><i></i>Jum</span><span class="sd"><i></i>Sab</span><span class="sd"><i></i>Min</span></div>Rekor barumu!</div></div>
</body></html>

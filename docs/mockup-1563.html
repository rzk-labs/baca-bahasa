<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1563 — Ulang sekarang</title>
<style>
body{margin:0;padding:16px;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:18px auto 6px;width:390px}
.ph{width:390px;margin:0 auto;background:#fff;border-radius:20px;padding:16px;box-sizing:border-box}
h1{font:700 20px "Bricolage Grotesque",Inter,sans-serif;margin:0 0 12px}
.nudge{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:14px;background:#351E28;color:#fff;padding:12px 14px;font:500 14px Inter,sans-serif;box-sizing:border-box}
.nudge span{flex:1;text-align:left}
.nudge b{background:#E9F056;color:#351E28;border-radius:999px;padding:6px 12px;font-size:13px}
.note{font-size:12px;opacity:.7;margin-top:10px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #351E28;border-radius:999px;padding:6px 12px;font-size:13px}
.chip i{font-style:normal;background:#E9F056;border-radius:999px;padding:0 6px;font-weight:700}
</style></head><body>
<div class="lbl">Sebelum (buku tamat)</div>
<div class="ph"><h1>Home</h1>
<button class="nudge"><span>7 kata siap diulang</span><b>Ulang kata sulit</b></button>
<div class="note">Kartu bilang "siap diulang", tombol bilang "sulit": membingungkan.</div></div>

<div class="lbl">Sesudah (semua kondisi)</div>
<div class="ph"><h1>Home</h1>
<button class="nudge"><span>7 kata siap diulang</span><b>Ulang sekarang</b></button>
<div class="note">Header Baca: chip juga sama.</div>
<div style="margin-top:8px"><span class="chip">Ulang sekarang <i>7</i></span></div></div>
</body></html>

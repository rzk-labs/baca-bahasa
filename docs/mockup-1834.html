<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1834</title>
<style>
body{margin:0;background:#eee;font:14px Inter,system-ui,sans-serif;color:#351E28}
.wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:16px}
.ph{width:390px;background:#D7EFFF;border-radius:20px;padding:16px;box-sizing:border-box}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;margin:0 0 8px}
.sheet{background:#fff;border-radius:16px;padding:16px}
h3{font:700 20px "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.row{display:flex;align-items:center;margin:8px 0}
.save{margin-left:auto;min-height:32px;padding:4px 14px;border-radius:999px;border:0;background:#351E28;color:#fff;font:700 14px inherit;position:relative}
.wsug{display:flex;flex-wrap:wrap;gap:12px 8px;background:#f4f4f4;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600;align-items:center}
.chip{min-height:32px;padding:4px 12px;border-radius:999px;border:1.5px solid #ccc;background:#fff;font-weight:700;font-size:12px;position:relative;box-sizing:border-box;display:inline-flex;align-items:center}
.hit{position:absolute;left:50%;top:50%;width:max(100%,44px);height:44px;transform:translate(-50%,-50%);outline:1px dashed #d33;pointer-events:none}
.note{font-size:12px;margin-top:8px}
</style></head><body>
<div class="wrap">
<div class="ph"><p class="lbl">Sesudah: garis merah putus = area ketuk 44px</p>
<div class="sheet"><h3>ingat</h3><div class="row"><span>mengingat; tidak lupa</span><button class="save">Simpan<span class="hit"></span></button></div>
<div class="wsug">Mau simpan frasa?
<span class="chip">tidak apa-apa<span class="hit"></span></span>
<span class="chip">sama-sama<span class="hit"></span></span>
<span class="chip">terima kasih banyak<span class="hit"></span></span></div>
<p class="note">Tampilan tombol sama. Area ketuk lebih lega, jarak antarbaris 12px.</p></div></div>
</div></body></html>

<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1020 — Kartu buku tamat di Home</title>
<style>
body{margin:0;padding:16px;background:#f4f1ee;font:14px/1.4 Inter,system-ui,sans-serif;color:#351E28}
.lbl{font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.ph{width:390px;max-width:100%;box-sizing:border-box;background:#fff;border-radius:24px;padding:16px;margin-bottom:8px}
.tile{border-radius:24px;background:#D7EFFF;color:#351E28;overflow:hidden}
.hero{display:flex;gap:16px}
.cov{width:72px;height:104px;border-radius:12px;background:#351E28;flex:none}
.inf{flex:1;min-width:0}
.eb{font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em}
.t{font:800 22px/24px "Bricolage Grotesque",Inter,sans-serif;margin:4px 0}
.sm{font-size:13px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.7);margin-top:10px}.bar i{display:block;height:100%;width:100%;border-radius:4px;background:#E9F056}
.act{display:flex;gap:10px}
button{font:600 15px Inter,sans-serif;border:0;border-radius:24px;color:#351E28;background:rgba(255,255,255,.7);padding:0 8px;cursor:default}
.pri{background:#351E28;color:#D7EFFF}
/* sebelum */
.b .tile{padding:18px}.b .act{margin-top:14px}.b button{min-height:48px;flex:1}
.b .wrap{white-space:normal;line-height:1.1}
/* sesudah */
.a .tile{padding:14px}.a .act{margin-top:10px}.a button{min-height:44px;flex:1 1 0;min-width:0;white-space:nowrap}
</style></head><body>
<h1 style="font:800 20px 'Bricolage Grotesque',Inter,sans-serif">#1020 Home: kartu buku tamat</h1>

<div class="lbl">Sebelum</div>
<div class="ph b"><div class="tile"><div class="hero"><div class="cov"></div><div class="inf"><div class="eb">Tamat</div><div class="t">Laskar Pelangi</div><div class="sm">Indonesia</div><div class="bar"><i></i></div></div></div>
<div class="act"><button class="pri">Baca ulang →</button><button class="wrap">Buku lain</button><button class="wrap" style="min-height:64px">Tambah buku baru</button></div></div></div>

<div class="lbl">Sesudah</div>
<div class="ph a"><div class="tile"><div class="hero"><div class="cov" style="width:64px;height:92px"></div><div class="inf"><div class="eb">Tamat</div><div class="t">Laskar Pelangi</div><div class="sm">Indonesia</div><div class="bar"><i></i></div></div></div>
<div class="act"><button class="pri">Baca ulang</button><button>Buku baru</button></div></div></div>
</body></html>

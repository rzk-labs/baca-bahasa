<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1296 — Logo utuh + Home mulai dari atas</title>
<style>
body{margin:0;padding:16px;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28}
.note{max-width:390px;margin:0 auto 10px;font-size:13px;font-weight:600}
.lbl{display:inline-block;background:#E9F056;color:#351E28;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin:8px 0 6px}
.ph{position:relative;width:390px;height:330px;margin:0 auto 6px;background:#FAF6EF;border-radius:24px;overflow:hidden;box-shadow:0 2px 12px rgba(53,30,40,.2)}

</div>

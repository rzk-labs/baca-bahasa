<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #2084 Home: kartu Simpan tak terpotong</title>
<style>
body{margin:0;background:#e9e6ea;font:14px/1.4 Inter,system-ui,sans-serif;color:#351E28;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:20px}
.w{width:390px}.lb{font:700 12px/16px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.ph{position:relative;width:390px;height:700px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1.5px #351E28}
.in{padding:18px 18px 0}
h1{font:800 26px/30px "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 14px}
.nb{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:20px;background:#D7EFFF;font-weight:600;font-size:13px;margin:10px 0}
.nb .g{margin-left:auto;font-weight:700}
.card{border-radius:20px;background:#E9F056;padding:12px 14px 14px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:6px}
.card b{font:700 15px/20px "Bricolage Grotesque",system-ui,sans-serif}.card i{font-style:normal;background:#351E28;color:#E9F056;border-radius:99px;padding:2px 8px;font-size:12px}
.card small{grid-column:1/-1;font-size:12px;opacity:.8}.seg{grid-column:1/-1;height:8px;border-radius:9px;box-shadow:inset 0 0 0 1.5px rgba(53,30,40,.45)}
.go{grid-column:1/-1;font-weight:700;font-size:13px;text-decoration:underline}
.box{height:90px;border-radius:20px;background:#f2eef0;margin:12px 0}
.tab{position:absolute;left:14px;right:14px;bottom:10px;height:76px;border-radius:28px;background:#351E28;color:#fff;display:flex;justify-content:space-around;align-items:center;font-size:12px}
.mask{position:absolute;left:0;right:0;bottom:0;height:110px;background:#fff}
</style></head><body>
<div class="w"><p class="lb">Sebelum: kartu Simpan tertutup bar menu</p><div class="ph"><div class="in"><h1>Home</h1><div class="nb">Keepo Pertama · 1 kata lagi</div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="card" style="margin-top:20px"><b>Simpan 1 kata dulu</b><i>0/1</i></div></div><div class="mask"></div><div class="tab"><span>Home</span><span>Baca</span><span>Ngomong</span><span>Kata</span></div></div></div>
<div class="w"><p class="lb">Sesudah: ketuk banner, kartu naik ke tengah layar</p><div class="ph"><div class="in"><h1>Home</h1><div class="nb">Keepo Pertama · 1 kata lagi<span class="g">→</span></div><div class="box"></div><div class="card"><b>Simpan 1 kata dulu</b><i>0/1</i><small>Ketuk kata di bacaan, lalu Simpan.</small><span class="seg"></span><span class="go">Buka bacaan →</span></div><div class="box"></div></div><div class="mask"></div><div class="tab"><span>Home</span><span>Baca</span><span>Ngomong</span><span>Kata</span></div></div></div>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1325 — Lencana Koleksi</title>
<style>
body{margin:0;background:#D7EFFF;font:14px/1.4 Inter,system-ui,sans-serif;color:#351E28;display:flex;flex-direction:column;align-items:center;padding:16px}
.ph{width:390px;max-width:100%;background:#fff;border-radius:24px;padding:18px;box-sizing:border-box}
h1,h2{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0}
h2{font-size:18px}.row{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.mut{color:#7a6670;font-size:12px}.tag{font-size:11px;font-weight:700;background:#E9F056;border-radius:8px;padding:2px 8px;display:inline-block;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.b{border-radius:16px;padding:14px 10px;background:#E9F056}.b b{display:block;font:800 15px/17px "Bricolage Grotesque",sans-serif}.b span{font-size:12px;display:block;margin-top:3px}
.off{background:#f3eff1;color:#7a6670}.bar{height:6px;border-radius:3px;background:#ddd;margin-top:6px}.bar i{display:block;height:100%;border-radius:3px;background:#351E28}
.n{background:#351E28;color:#fff;border-radius:12px;padding:10px;text-align:center;margin-top:12px}
</style></head><body>
<p class="mut">Gambaran rencana, belum dibangun — Profil › Lencana (390px)</p>
<div class="ph"><span class="tag">Sesudah</span>
<div class="row"><h2>Lencana</h2><span class="mut">3/12 kebuka</span></div>
<div class="g">
<div class="b"><b>Keepo Pertama</b><span>Didapat</span></div>
<div class="b" style="background:#D7EFFF"><b>Kolektor</b><span>Didapat</span></div>
<div class="b" style="background:#E9F056"><b>Koleksi 50</b><span>Didapat</span></div>
<div class="b off"><b>Koleksi 100</b><span>🔒 Simpan 100 kata</span><span>62/100</span><div class="bar"><i style="width:62%"></i></div></div>
<div class="b off"><b>Kutu Buku</b><span>🔒 Balik 20 halaman</span><span>4/20</span><div class="bar"><i style="width:20%"></i></div></div>
<div class="b off"><b>Berani Ngomong</b><span>🔒 Selesaikan 1 tantangan</span></div>
</div>
<div class="n">Lencana baru: Koleksi 50!</div></div>
</body></html>

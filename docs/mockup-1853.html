<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1853 — Titik hari Streak</title>
<style>
:root{--ink:#351E28;--cream:#FAF7F0;--ice:#D7EFFF;--hl:#E9F056}
*{box-sizing:border-box}
body{margin:0;background:#e9e4da;font:400 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink)}
.ph{width:390px;margin:16px auto;background:var(--ice);padding:16px;border-radius:24px}
.lab{font:700 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--hl);display:inline-block;padding:4px 8px;border-radius:99px;margin:0 0 10px}
.card{background:var(--cream);border-radius:20px;padding:14px 12px}
.num{font:800 30px/34px "Bricolage Grotesque",Inter,sans-serif}
.num small{font:700 13px/17px Inter,sans-serif}
.lbl{font:600 12px/16px Inter,sans-serif;opacity:.75}
.sdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:8px 0 6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:2px}
.sd em{font:600 12px/15px Inter,sans-serif;font-style:normal;opacity:.75}
.sd.td em{font-weight:800;opacity:1;text-decoration:underline;text-underline-offset:2px}
.sd i{display:block;box-sizing:border-box;position:relative;width:11px;height:11px;border-radius:50%;border:1px solid var(--ink)}
.sd i.on,.sd i.old{background:var(--ink)}
.sd i.on::after{content:"";position:absolute;left:3px;top:1.5px;width:3px;height:5px;border:solid var(--cream);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.sd i.ring{border-width:2px}
.old1 i{width:8px;height:8px;border:0;background:rgba(53,30,40,.22)}
.old1 i.on{background:var(--ink)}.old1 i.old{background:rgba(53,30,40,.4)}.old1 i.on::after{display:none}
.old1 i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.note{font:500 12px/16px Inter,sans-serif;margin:8px 2px 0}
</style></head><body>
<div class="ph">
<p class="lab">Sebelum</p>
<div class="card"><div class="num">3 <small>hari berturut</small></div>
<div class="sdots old1">
<span class="sd"><i></i><em>Min</em></span><span class="sd"><i class="old"></i><em>Sen</em></span><span class="sd"><i></i><em>Sel</em></span><span class="sd"><i class="on"></i><em>Rab</em></span><span class="sd"><i class="on"></i><em>Kam</em></span><span class="sd"><i class="on"></i><em>Jum</em></span><span class="sd td"><i class="ring"></i><em>Sab</em></span>
</div><div class="lbl">Baca hari ini biar lanjut</div></div>
<p class="note">Semua titik mirip, sulit dibedakan.</p>
</div>

<div class="ph">
<p class="lab">Sesudah</p>
<div class="card"><div class="num">3 <small>hari berturut</small></div>
<div class="sdots">
<span class="sd"><i></i><em>Min</em></span><span class="sd"><i class="old"></i><em>Sen</em></span><span class="sd"><i></i><em>Sel</em></span><span class="sd"><i class="on"></i><em>Rab</em></span><span class="sd"><i class="on"></i><em>Kam</em></span><span class="sd"><i class="on"></i><em>Jum</em></span><span class="sd td"><i class="ring"></i><em>Sab</em></span>
</div><div class="lbl">Baca hari ini biar lanjut</div></div>
<p class="note">Sudah baca = titik penuh (streak ada centang). Bolong = cincin tipis. Hari ini belum = cincin tebal.</p>
</div>
</body></html>

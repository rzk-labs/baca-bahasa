<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1499</title>
<style>
body{margin:0;padding:16px;background:#eee;font:14px/18px Inter,system-ui,sans-serif;color:#351E28}
.lbl{font:700 12px/16px system-ui;margin:12px auto 6px;width:390px;opacity:.7}
.ph{width:390px;margin:0 auto 20px;background:#FAF7F0;border-radius:24px;padding:16px;box-sizing:border-box}

.hero{background:#D7EFFF;border-radius:20px;padding:14px;margin-bottom:8px}.hero b{display:block;font-size:16px}

.nd>span{flex:1;min-width:0}.nd small{display:block;font-weight:400;font-size:12px;opacity:.75}

.go{padding:8px 12px;min-height:36px;border-radius:999px;background:#351E28;color:#D7EFFF;display:inline-flex;align-items:center;white-space:nowrap;font-size:13px}
.nav{margin-top:16px;padding:12px;border-radius:16px;background:#351E28;color:#D7EFFF;text-align:center;font-size:12px}
</style></head><body>

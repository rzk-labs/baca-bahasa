<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1177 – Lencana terbuka</title>
<style>
body{margin:0;background:#e8e8ee;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{max-width:390px;margin:16px auto 6px;font:700 12px/16px Inter,sans-serif;color:#555}
.ph{width:390px;margin:0 auto 16px;background:#fff;border-radius:20px;padding:16px;box-sizing:border-box}
h2{font:800 18px/22px "Bricolage Grotesque",Inter,sans-serif;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font:400 13px Inter,sans-serif;color:#6b5a62}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border-radius:20px;padding:14px 10px;color:#351E28;min-width:0}
.badge b{display:block;font:800 15px/17px "Bricolage Grotesque",Inter,sans-serif;margin-top:4px}
.em{display:block;font-size:26px;line-height:38px}
.d{display:flex;gap:4px;font-size:12px;line-height:16px;margin-top:3px;overflow-wrap:anywhere}
.t1{background:#E9F056}.t2{background:#D7EFFF}.t3{background:#351E28;color:#fff}
.off{background:#f3f0f2;color:#6b5a62}.off .em{filter:grayscale(1);opacity:.45}
.got{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:2px 8px 2px 6px;border-radius:9999px;background:#351E28;color:#E9F056;font-size:12px;line-height:16px;font-weight:800}
.t3 .got{background:#E9F056;color:#351E28}
svg{width:12px;height:12px;flex:none;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.d svg{stroke-width:2;margin-top:2px}
.bp{display:inline-block;margin-top:6px;font:800 13px/16px Inter,sans-serif;background:#351E28;color:#E9F056;border-radius:9999px;padding:2px 8px}
.old .got{display:none}
</style></head><body>
<div class="lbl">Sesudah – layar Profil, bagian Lencana (HP 390px)</div>
<div class="ph">
<h2>Lencana <span>3/10 kebuka</span></h2>
<div class="bgrid">
<div class="badge t1" aria-label="Lencana Keepo Pertama, sudah didapat"><span class="em">👁</span><b>Keepo Pertama</b><span class="d">Simpan 1 kata</span><span class="got"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Didapat</span></div>
<div class="badge t2" aria-label="Lencana Kolektor, sudah didapat"><span class="em">🔖</span><b>Kolektor</b><span class="d">Simpan 10 kata</span><span class="got"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Didapat</span></div>
<div class="badge t3" aria-label="Lencana Kutu Buku, sudah didapat"><span class="em">📖</span><b>Kutu Buku</b><span class="d">Balik 20 halaman</span><span class="got"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Didapat</span></div>
<div class="badge off" aria-label="Lencana Berani, belum didapat"><span class="em">🎤</span><b>Berani</b><span class="d"><svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Selesaikan 1 tantangan</span></div>
<div class="badge off" aria-label="Lencana Otak, belum didapat"><span class="em">🧠</span><b>Otak</b><span class="d"><svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Hafal 10 kartu</span><span class="bp">4/10</span></div>
<div class="badge off" aria-label="Lencana Boss, belum didapat"><span class="em">👑</span><b>Boss</b><span class="d"><svg viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Kalahin 5 kata sulit</span></div>
</div>
</div>
</body></html>

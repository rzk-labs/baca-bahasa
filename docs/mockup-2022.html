<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #2022 – ruang bawah Home</title>
<style>
body{margin:0;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
.note{font-size:12px;max-width:390px;text-align:center}
.lbl{font-size:11px;font-weight:700;background:#E9F056;padding:2px 8px;border-radius:99px}
.phone{position:relative;width:390px;height:640px;background:#FFF8EE;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1.5px #351E28}
.scroll{padding:16px 18px;height:100%;box-sizing:border-box}
h1{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:22px;margin:0 0 12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 0 0 1.5px #351E28}
.card p{margin:0 0 10px;font-size:14px}
.btn{display:block;text-align:center;background:#351E28;color:#FFF8EE;border-radius:99px;padding:12px;font-weight:700;font-size:14px}
.tabs{position:absolute;left:14px;right:14px;bottom:10px;height:76px;background:#351E28;border-radius:99px;display:flex;justify-content:space-around;align-items:center;color:#FFF8EE;font-size:13px;font-weight:700}
.fade{position:absolute;left:0;right:0;bottom:0;height:100px;background:#FFF8EE;opacity:.0}
.cut .card:last-child{margin-bottom:-30px}
</style></head><body>
<p class="note">Sesudah perbaikan: tombol terakhir terlihat penuh di atas bar menu.</p>
<span class="lbl">Sesudah</span>
<div class="phone"><div class="scroll">
<h1>Halo, Keepo!</h1>
<div class="card"><p>Kata siap diulang: 5</p><span class="btn">Ulang sekarang</span></div>
<div class="card"><p>Target hari ini: 3 dari 5 kata</p><span class="btn">Lanjut baca</span></div>
<div class="card" style="margin-bottom:170px"><p>Belum ada kata tersimpan.</p><span class="btn">Simpan 1 kata dulu</span></div>
</div>
<div class="tabs"><span>Home</span><span>Baca</span><span>Ngomong</span><span>Kata</span></div></div>
</body></html>

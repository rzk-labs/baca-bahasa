<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1949: Tamat tanpa kata bocor</title>
<style>
body{margin:0;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:24px}
.col{width:390px}

.mut{color:#6b5a62;font-size:14px;margin:0 0 8px}
.pri{display:block;width:100%;background:#351E28;color:#fff;border:0;border-radius:14px;padding:12px;font-size:16px;font-weight:600;text-align:left}
.pri small{display:block;font-weight:400;color:#D7EFFF;font-size:13px}
.lnk{color:#351E28;text-decoration:underline;font-size:14px;margin-right:12px}
.hl{background:#E9F056;padding:0 4px;border-radius:4px}

<div class="col"><span class="lbl">Sebelum</span>
<div class="sheet"><p class="mut">3 Bagian · 2 kata baru</p><h2>Tamat! Keren banget</h2>
<div class="mut"><span class="hl">아침, 사</span> (kata Korea bocor)</div>
<button class="pri">Lanjut: 우산을 잃어버린 날<small>Korea · Belum mulai</small></button></div></div>
<div class="col"><span class="lbl">Sesudah</span>
<div class="sheet"><p class="mut">3 Bagian</p><h2>Tamat! Keren banget</h2>
<p class="mut">Tidak ada kata baru kali ini. Ketuk kata di cerita untuk menyimpannya.</p>
<button class="pri">Lanjut: 우산을 잃어버린 날<small>Korea · Belum mulai</small></button>
<p style="margin-top:12px"><span class="lnk">Buku baru</span><span class="lnk">Baca ulang (tanpa XP)</span></p></div></div>
</body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1562 · Home buku tamat</title>
<style>
body{margin:0;padding:16px;background:#eee;font:14px/1.4 Inter,system-ui,sans-serif;color:#351E28}
.lbl{font:700 12px/1 Inter,sans-serif;margin:12px auto 6px;width:390px;text-transform:uppercase;letter-spacing:.05em}
.ph{width:390px;box-sizing:border-box;margin:0 auto;padding:16px;background:#D7EFFF;border-radius:20px}
.card{background:#F7C6DA;border-radius:20px;padding:14px}
.t{font:800 17px/20px "Bricolage Grotesque",Inter,sans-serif;overflow-wrap:anywhere}
.sm{font-size:13px;margin-top:2px}
.btn{display:block;width:100%;min-height:48px;margin-top:10px;border:0;border-radius:16px;font:700 15px/1 Inter,sans-serif}
.pri{background:#351E28;color:#fff}
.sec{background:rgba(255,255,255,.7);color:#351E28}
.nudge{display:flex;align-items:center;min-height:44px;margin-top:12px;padding:12px 14px;border-left:4px solid #E9F056;border-radius:20px;background:#fff;font-weight:700}
.re{text-align:center;margin-top:2px}
.lnk{display:inline-block;min-height:44px;line-height:44px;padding:0 12px;text-decoration:underline;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row .btn{width:auto;margin:0;padding:0 14px;min-height:44px}
</style></head><body>
<div class="lbl">Sebelum</div>
<div class="ph"><div class="card"><div class="row"><div><div class="t">Le Petit Prince</div><div class="sm">Selesai · Prancis</div></div><button class="btn sec">Baca ulang</button></div></div>
<div class="nudge">📖&nbsp;Pilih buku berikutnya</div></div>
<div class="lbl">Sesudah</div>
<div class="ph"><div class="card"><div class="t">Le Petit Prince</div><div class="sm">Selesai · Prancis</div>
<button class="btn pri">Pilih buku berikutnya</button>
<div class="re"><span class="lnk">Baca ulang</span></div></div></div>
</body></html>

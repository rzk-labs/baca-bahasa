<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #2030 Sheet Tamat</title>
<style>
body{margin:0;padding:16px;background:#eee;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{font:600 12px Inter,sans-serif;margin:12px auto 6px;max-width:390px;color:#555}
.sheet{width:390px;max-width:100%;margin:0 auto;background:#fff;border-radius:20px;padding:20px;box-sizing:border-box}
h2{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:20px;margin:8px 0}
.mut{color:#6b5a62;font-size:14px;margin:0 0 6px}
.hl{background:#E9F056;padding:0 3px}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#351E28;color:#D7EFFF;font:600 16px Inter,sans-serif;margin-top:12px}
.lnk{background:none;color:#351E28;text-decoration:underline}
</style></head><body>
<div class="lbl">Sebelum</div>
<div class="sheet"><h2>3 kata disimpan dari "Little Prince"</h2>
<p class="mut">Besok: simpan 1 kata dulu</p>
<p class="mut">Tersimpan total: <b>3</b> kata<br>Siap diulang sekarang: <b>2</b> kata</p>
<button>Ulang 2 kata</button><button class="lnk">Ke Home</button></div>
<div class="lbl">Sesudah</div>
<div class="sheet"><h2>3 kata disimpan dari "Little Prince"</h2>
<p class="mut"><span class="hl">Hari ini</span>: simpan 1 kata dulu</p>
<p class="mut">Tersimpan total: <b>3</b> kata<br>Siap diulang sekarang: <b>2</b> kata</p>
<button>Ulang 2 kata</button><button class="lnk">Ke Home</button></div>
</body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1381 Kartu Streak</title>
<style>
body{margin:0;background:#D7EFFF;font:14px/1.4 Inter,system-ui,sans-serif;color:#351E28;display:flex;gap:24px;flex-wrap:wrap;padding:20px;justify-content:center}
.ph{width:390px;box-sizing:border-box;background:#fff;border-radius:24px;padding:16px}
.tag{font:700 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;opacity:.7}
h1{font:800 20px/24px "Bricolage Grotesque",Inter,sans-serif;margin:0 0 4px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.g>div{border-radius:20px;padding:12px 6px;text-align:center;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.sun{background:#E9F056}.lime{background:#cfe9a0}.lav{background:#d8cdf5}
.eb{font:700 11px/14px Inter,sans-serif;color:rgba(53,30,40,.75);text-transform:uppercase;letter-spacing:.04em}
.num{font:800 28px/30px "Bricolage Grotesque",Inter,sans-serif;display:flex;align-items:center;gap:3px;white-space:nowrap}
.num small{font:700 13px/17px Inter,sans-serif}
.num svg{width:22px;height:22px}
.dots{display:flex;gap:1px;margin:4px 0}
.sd{display:flex;flex-direction:column;align-items:center;gap:2px;width:10px}
.sd i{width:8px;height:8px;border-radius:50%;background:rgba(53,30,40,.22)}
.sd i.on{background:#351E28}.sd i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px #351E28}
.sd b{font:500 11px/13px Inter,sans-serif;color:rgba(53,30,40,.6)}.sd.now b{font-weight:800;color:#351E28}
.l{font:700 12px/15px Inter,sans-serif}
</style></head><body>
<div class="ph" style="width:320px"><p class="tag">Sesudah · 9 hari (layar 320px)</p><h1>Home</h1>
<div class="g"><div class="sun"><div class="eb">Streak</div>
<div class="num"><svg viewBox="0 0 24 24" fill="#351E28"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 2 4-5z"/></svg>9 <small>hari</small></div>
<div class="dots"><span class="sd"><i class="on"></i><b>J</b></span><span class="sd"><i class="on"></i><b>S</b></span><span class="sd"><i class="on"></i><b>M</b></span><span class="sd"><i class="on"></i><b>S</b></span><span class="sd"><i class="on"></i><b>S</b></span><span class="sd"><i class="on"></i><b>R</b></span><span class="sd now"><i class="on"></i><b>K</b></span></div>
<div class="l">Rekor barumu!</div></div>
<div class="lime"><div class="eb">Target</div><div class="num">3/5</div><div class="l">kata</div></div>
<div class="lav"><div class="eb">Level</div><div class="num">4</div><div class="l">120 XP</div></div></div></div>

<div class="ph" style="width:320px"><p class="tag">Sesudah · streak 0</p><h1>Home</h1>
<div class="g"><div class="sun"><div class="eb">Streak</div>
<div class="num"><svg viewBox="0 0 24 24" fill="#351E28"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 2 4-5z"/></svg><small>Mulai hari ini</small></div>
<div class="dots"><span class="sd"><i></i><b>J</b></span><span class="sd"><i></i><b>S</b></span><span class="sd"><i></i><b>M</b></span><span class="sd"><i></i><b>S</b></span><span class="sd"><i></i><b>S</b></span><span class="sd"><i></i><b>R</b></span><span class="sd now"><i class="ring"></i><b>K</b></span></div>
<div class="l">Mulai hari ini yuk</div></div>
<div class="lime"><div class="eb">Target</div><div class="num">0/5</div><div class="l">kata</div></div>
<div class="lav"><div class="eb">Level</div><div class="num">1</div><div class="l">0 XP</div></div></div></div>
</body></html>

<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1691 — Kartu Level Home</title>
<style>
:root{--ink:#351E28;--cream:#FAF7F0;--hl:#E9F056;--lime:#AEB8A0;--lav:#C3E1F4;--sun:#EFEBCB}
*{box-sizing:border-box}body{margin:0;background:#e8e4dc;font:15px/22px Inter,system-ui,sans-serif;color:var(--ink)}
.lab{width:390px;margin:16px auto 6px;font:700 12px/16px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.ph{width:390px;margin:0 auto 16px;background:var(--cream);padding:16px;border-radius:20px}
.eyebrow{font-size:12px;line-height:16px;font-weight:600;color:rgba(53,30,40,.75)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.grid>div{border-radius:20px;padding:12px 10px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;overflow:hidden}
.streak{grid-column:1/-1;background:var(--sun);min-height:0!important;font-weight:700;padding:10px!important}
.tg{background:var(--lime)}.lv{background:var(--lav)}
.ring{width:72px;height:72px;border-radius:50%;border:6px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 19px/19px "Bricolage Grotesque",sans-serif;margin:2px 0}
.ring small{font:600 11px/12px Inter,sans-serif}
.l2{font-size:12px;line-height:14px;font-weight:700}
.eg{font-size:11px;line-height:14px;font-weight:600;color:rgba(53,30,40,.82)}
.lv{justify-content:center!important;gap:6px}
.num{font:800 32px/34px "Bricolage Grotesque",sans-serif}
.bar{width:100%;height:6px;border-radius:3px;background:var(--ink);margin-top:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hl)}
.row{display:flex;gap:6px;justify-content:center;font-size:12px;line-height:16px;font-weight:700}
.old{background:var(--lav);align-items:flex-start!important;text-align:left!important}
.old .num{font-size:28px;line-height:30px}.old .bar{width:70%;margin:8px 0 0}.old .l2{margin-top:6px}
</style></head><body>
<div class="lab">Sebelum (rata kiri, bolong di kanan)</div>
<div class="ph"><div class="eyebrow">Home · HP 390px</div>
<div class="grid"><div class="streak">Streak · 3 hari</div>
<div class="tg"><div class="eyebrow">Target</div><div class="ring">12<small>XP</small></div><div class="l2">12 dari 30 XP</div><div class="eg">±5 menit baca</div></div>
<div class="old"><div class="eyebrow">Level</div><div class="num">4</div><div class="bar"><i style="width:42%"></i></div><div class="l2">42/100 XP</div></div></div></div>

<div class="lab">Sesudah (rata tengah, angka besar, rapat)</div>
<div class="ph"><div class="eyebrow">Home · HP 390px</div>
<div class="grid"><div class="streak">Streak · 3 hari</div>
<div class="tg"><div class="eyebrow">Target</div><div class="ring">12<small>XP</small></div><div class="l2">12 dari 30 XP</div><div class="eg">±5 menit baca</div></div>
<div class="lv"><div class="eyebrow">Level</div><div class="num">4</div><div class="bar"><i style="width:42%"></i></div><div class="row"><span>42/100 XP</span><span>→ Lv 5</span></div></div></div></div>
</body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1816 Toast Home</title>
<style>
body{margin:0;padding:16px;background:#eee;font-family:Inter,system-ui,sans-serif;display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.lb{font:700 12px Inter,sans-serif;text-align:center;margin-bottom:6px;color:#351E28}

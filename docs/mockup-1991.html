<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1991: Sheet Tamat</title>
<style>
body{margin:0;background:#eee;font:15px/1.4 Inter,system-ui,sans-serif;color:#351E28}
.wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:20px}
.col small{display:block;text-align:center;font-weight:700;margin-bottom:6px}
.ph{width:390px;background:#D7EFFF;border-radius:24px;padding:20px;box-sizing:border-box;position:relative;min-height:560px}
h2{font:700 20px/1.2 "Bricolage Grotesque",Inter,sans-serif;margin:8px 0}
.mut{color:#6b5560;font-size:13px;margin:0 0 6px}
.pri{display:block;width:100%;min-height:48px;border:0;border-radius:14px;background:#351E28;color:#fff;font:700 16px Inter,sans-serif;margin-top:14px}
.lnk{display:block;margin:6px auto 0;background:none;border:0;color:#351E28;text-decoration:underline;font:600 14px Inter,sans-serif;min-height:44px}
.sh{background:#fff;border-radius:20px;padding:16px;margin-top:80px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;background:#351E28;color:#fff;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:700}
.tag{background:#E9F056;padding:0 4px}
</style></head><body><div class="wrap">
<div class="col"><small>Sebelum</small><div class="ph"><div class="sh"><p class="mut">3 Bagian · 4 kata baru</p><h2>4 kata disimpan</h2><button class="pri">Ulang 5 kata siap</button><a class="lnk">Buku baru</a><a class="lnk">Baca ulang (tanpa XP)</a><a class="lnk">Ke Home</a></div></div></div>
<div class="col"><small>Sesudah: ada kata jatuh tempo</small><div class="ph"><div class="sh"><p class="mut">3 Bagian · 4 kata baru</p><h2>4 kata disimpan dari "Buku"</h2><p class="mut">Besok: <span class="tag">simpan 3 kata dulu</span></p><button class="pri">Ulang 5 kata</button><a class="lnk">Ke Home</a></div><div class="toast">Level 11!</div></div></div>
<div class="col"><small>Sesudah: tanpa kata jatuh tempo</small><div class="ph"><div class="sh"><h2>Tamat! Keren banget</h2><button class="pri">Lanjut: Buku berikutnya</button><a class="lnk">Ke Home</a></div></div></div>
</div></body></html>

body{margin:0;background:#e9e6ea;font:14px/20px Inter,system-ui,sans-serif;color:#351E28;padding:16px}
.lbl{font:700 12px/16px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:16px auto 6px;width:390px;color:#351E28}
.ph{width:390px;margin:0 auto;background:#fff;border-radius:20px;padding:16px;box-sizing:border-box;overflow:hidden}
h1{font:800 28px/32px "Bricolage Grotesque",Inter,sans-serif;margin:6px 2px 12px}
h1 span{background:#E9F056;padding:0 4px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sum div{background:#D7EFFF;border-radius:14px;padding:8px;text-align:center}
.sum b{display:block;font-size:20px}.sum span{font-size:11px}
.seg{display:flex;background:#f2eef0;border-radius:999px;padding:3px}
.seg button{flex:1;min-height:44px;border:0;background:none;border-radius:999px;font:600 14px Inter,sans-serif;color:#351E28}
.seg .on{background:#351E28;color:#fff}
.hardcnt{display:flex;align-items:center;gap:8px;min-height:44px;margin:2px 0 6px;padding:0 6px;background:none;border:0;color:#6b5a62;font:600 13px/18px Inter,sans-serif}
.hardcnt span{text-decoration:underline;text-underline-offset:3px}
.hardcnt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.flash{border:1.5px solid #351E28;border-radius:20px;padding:24px 16px;text-align:center;margin-top:8px}
.flash .fw{font:800 32px/36px "Bricolage Grotesque",sans-serif}
.eyebrow{font-size:12px;color:#6b5a62;margin-bottom:8px}
.yes{display:block;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:999px;background:#351E28;color:#fff;font:700 15px Inter,sans-serif}
.center{text-align:center;margin-top:8px}
.hardbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;background:#fff;border:1.5px solid #351E28;border-radius:999px;color:#351E28;font:600 14px Inter,sans-serif}
.hardbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.hardbtn.on svg{fill:currentColor}
.mut{color:#6b5a62;font-size:13px;text-align:center;margin-top:6px}

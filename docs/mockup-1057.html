<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1057</title>
<style>
body{margin:0;background:#D7EFFF;font:14px/1.4 Inter,system-ui,sans-serif;color:#351E28}
.ph{width:390px;margin:16px auto;background:#FAF7F0;padding:16px;box-sizing:border-box;border-radius:24px}
.lab{font:700 11px/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#6b4a58;margin:0 0 10px}
h2{font:800 18px/1.2 "Bricolage Grotesque",Inter,sans-serif;margin:16px 0 8px}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.s3>div{border-radius:20px;padding:12px 6px;text-align:center;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box}
.s3 .e{font-size:11px;opacity:.75}.s3 .n{font:800 28px/30px "Bricolage Grotesque",Inter,sans-serif}.s3 .l{font-size:11px;font-weight:700;white-space:nowrap}
.bar{height:4px;width:100%;border-radius:9px;background:#351E28;overflow:hidden}.bar i{display:block;height:100%;background:#E9F056}
.hs{display:flex;gap:8px;overflow:hidden}
.b{flex:none;width:104px;border-radius:20px;padding:14px 10px;box-sizing:border-box}
.b b{display:block;font:800 15px/17px "Bricolage Grotesque",Inter,sans-serif}
.b .d{font-size:12px;line-height:16px;margin-top:3px;display:block}
.off{background:#fff;color:#7a6670}.off .bar{background:#e4dde0;margin-top:3px}.off .bar i{background:#7a6670}
.bp{display:block;font-size:11px;font-weight:700;margin-top:6px}
.on{background:#E9F056}
</style></head><body><div class="ph">
<p class="lab">Sesudah — Home</p>
<div class="s3">
<div style="background:#C3E1F4"><span class="e">Level</span><span class="n">3</span><span class="l">42/100 XP</span><div class="bar"><i style="width:42%"></i></div></div>
<div style="background:#E9F056"><span class="e">Streak</span><span class="n">5</span><span class="l">hari</span></div>
<div style="background:#D7EFFF"><span class="e">Target</span><span class="n">30</span><span class="l">XP hari ini</span></div>
</div>
<h2>Lencana</h2><p class="lab">Sesudah — Profil</p>
<div class="hs">
<div class="b on"><b>Keepo Pertama</b><span class="d">Simpan 1 kata</span></div>
<div class="b off"><b>Kolektor</b><span class="d">Simpan 10 kata</span><span class="bp">4/10</span><div class="bar"><i style="width:40%"></i></div></div>
<div class="b off"><b>Kutu Buku</b><span class="d">Balik 20 halaman</span><span class="bp">12/20</span><div class="bar"><i style="width:60%"></i></div></div>
</div></div></body></html>

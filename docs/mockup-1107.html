<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1107 Home pemula</title>
<style>
body{margin:0;background:#ddd;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{text-align:center;font-size:12px;font-weight:700;padding:8px}
.ph{width:390px;margin:0 auto 20px;background:#D7EFFF;padding:16px;box-sizing:border-box;min-height:760px;position:relative}
h1{font:800 40px/40px "Bricolage Grotesque",Inter,sans-serif;margin:4px 0}
h1 span{background:#E9F056;padding:0 4px}
.pic{height:150px;margin:10px auto;background:#FAF7F0;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#5F5059}
.sub{font-size:15px;line-height:22px;color:#5F5059;margin:0 0 12px}
.cta{display:flex;min-height:52px;border-radius:9999px;background:#351E28;color:#FAF7F0;font:800 17px "Bricolage Grotesque",Inter,sans-serif;align-items:center;justify-content:center}
.st{display:grid;gap:10px;margin-top:16px}
.st>div{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:600;padding:12px;border-radius:20px}
.st b{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
.st .one{background:#E7DADF;border:2px solid #351E28;font-weight:700}.st .one span{flex:1}
.st .two{background:#C3E1F4}.st .three{background:#EFEBCB}
.tabs{position:absolute;left:14px;right:14px;bottom:10px;display:flex;gap:8px;background:#351E28;border-radius:9999px;padding:6px}
.tabs i{flex:1;text-align:center;font:700 13px Inter;font-style:normal;color:#FAF7F0;padding:14px 0;border-radius:9999px}
.tabs i.on{background:#AEB8A0;color:#351E28}
</style></head><body>
<div class="lbl">Sesudah: Home saat rak masih kosong</div>
<div class="ph"><h1>Kepoin<br>bahasa <span>baru.</span></h1>
<div class="pic">Gambar buku (kecil)</div>
<p class="sub">Baca buku atau cerita sendiri. Ketuk kata yang bikin kepo, artinya langsung muncul.</p>
<div class="cta">Masukin cerita →</div>
<div class="st"><div class="one"><b>1</b><span>Masukin cerita favoritmu</span><strong>→</strong></div><div class="two"><b>2</b>Ketuk kata yang bikin bingung</div><div class="three"><b>3</b>Ngomongin kalimatnya, dapet skor &amp; XP</div></div>
<div class="tabs"><i class="on">Home</i><i>Baca</i><i>Ngomong</i><i>Kata</i></div></div>
</body></html>

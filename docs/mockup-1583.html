<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1583 — pilihan aktif terbaca pembaca layar</title>
<style>
body{margin:0;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28}
.p{width:390px;margin:16px auto;background:#fff;border-radius:20px;padding:16px;box-sizing:border-box}
h1,h2{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0 0 8px}
h1{font-size:20px}h2{font-size:16px}
.lbl{font-size:12px;color:#6b5560;margin:0 0 8px}
.seg{display:flex;gap:4px;background:#f1ecee;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font:600 14px Inter,sans-serif;color:#351E28}
.seg button.on{background:#351E28;color:#fff}
.note{font-size:12px;background:#E9F056;border-radius:8px;padding:6px 8px;margin:0 0 12px}
code{font-size:11px}
</style></head><body>
<div class="p">
<p class="note">Perubahan tak terlihat mata: hanya pembaca layar yang kini tahu pilihan aktif.</p>
<h1>Tab Kata</h1>
<p class="lbl">Sebelum: terbaca "Kartu, tombol", "Tersimpan, tombol"</p>
<p class="lbl">Sesudah: grup "Tampilan kata" — "Kartu, tombol tertekan"</p>
<div class="seg" role="group" aria-label="Tampilan kata"><button class="on" aria-pressed="true">Kartu</button><button aria-pressed="false">Tersimpan</button><button aria-pressed="false">Susah diucap</button></div>
<h2>Kirim masukan</h2>
<p class="lbl">Grup "Jenis masukan"</p>
<div class="seg" role="group" aria-label="Jenis masukan"><button class="on" aria-pressed="true">Ide</button><button aria-pressed="false">Masalah</button><button aria-pressed="false">Hapus konten</button></div>
</div></body></html>

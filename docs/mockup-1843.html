<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1843 — Teks & ikon pudar lebih kontras</title>
<style>
body{margin:0;padding:16px;background:#ddd;font:400 14px/1.4 Inter,system-ui,sans-serif;color:#351E28}
.phone{width:390px;box-sizing:border-box;margin:0 auto 20px;background:#D7EFFF;border-radius:20px;padding:16px}
.lbl{font:700 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;color:#5F5059}
h1{font:800 20px/1.2 "Bricolage Grotesque",Inter,sans-serif;margin:0 0 12px}
.intip{background:#C3E1F4;border-radius:16px;padding:10px 12px}
.irow{display:flex;align-items:center;gap:8px;min-height:44px;border-top:1px solid #B2CFE2}
.iw{font-weight:700;max-width:45%}.im{flex:1;color:#5F5059}
.ia{width:28px;text-align:center;font-weight:800}
.before .done{opacity:.6}
.after .done .iw{color:#5F5059}
.vitem{display:flex;align-items:center;gap:8px;background:#FAF7F0;border-radius:14px;padding:10px 12px;margin-top:8px}
.vitem .inf{flex:1}.vitem b{display:block}.vitem small{color:#5F5059}
.del{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#5F5059;font-size:18px}
.before .del{opacity:.55}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:0;font:700 14px Inter,sans-serif;background:#351E28;color:#FAF7F0}
.before .pill.off{opacity:.6}
.after .pill.off{background:#C3E1F4;color:#5F5059}
.note{font-size:12px;color:#5F5059;margin-top:8px}
</style></head><body>
<div class="phone before"><p class="lbl">Sebelum — pudar pakai opacity (kontras 2,4–3,8)</p>
<h1>Intip kata bab</h1>
<div class="intip"><div class="irow"><span class="iw">sagen</span><span class="im">berkata</span><span class="ia"></span></div>
<div class="irow done"><span class="iw">Haus</span><span class="im">rumah</span><span class="ia">✓</span></div></div>
<h1 style="margin-top:16px">Tab Kata</h1>
<div class="vitem"><div class="inf"><b>Wasser</b><small>air</small></div><button class="pill off" disabled>Simpan</button><span class="del">🗑</span></div></div>

<div class="phone after"><p class="lbl">Sesudah — warna jelas, centang tetap (kontras min 5,0)</p>
<h1>Intip kata bab</h1>
<div class="intip"><div class="irow"><span class="iw">sagen</span><span class="im">berkata</span><span class="ia"></span></div>
<div class="irow done"><span class="iw">Haus</span><span class="im">rumah</span><span class="ia">✓</span></div></div>
<h1 style="margin-top:16px">Tab Kata</h1>
<div class="vitem"><div class="inf"><b>Wasser</b><small>air</small></div><button class="pill off" disabled>Simpan</button><span class="del">🗑</span></div>
<p class="note">Baris selesai: teks abu-plum jelas + centang. Tata letak sama.</p></div>
</body></html>

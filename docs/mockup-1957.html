<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Mockup #1957: Centang Tamat tak menutupi huruf</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#D7EFFF;color:#351E28;font:15px/1.5 Inter,system-ui,sans-serif;width:390px;padding:0 0 24px}
.lbl{display:inline-block;margin:14px 16px 8px;padding:2px 10px;border-radius:999px;background:#351E28;color:#FFF8EE;font-size:12px;font-weight:700}
.scr{margin:0 12px;border:1.5px solid #351E28;border-radius:20px;background:#D7EFFF;padding:16px 14px}
h1{font:800 26px/1.1 "Bricolage Grotesque",Inter,sans-serif;margin:0 0 12px}
.shelf{background:#F1ECE1;color:#2B2228;border-radius:14px;padding:10px;overflow:hidden}
.g{font-size:12px;font-weight:700;margin:0 2px 8px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bk{position:relative}
.cover{height:92px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:800 30px "Bricolage Grotesque",Inter,sans-serif;color:#FFF8EE}
.c1{background:#351E28}.c2{background:#5B3A9A}.c3{background:#2F6F5E;font-size:26px}
.tag{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#E9F056;color:#351E28;box-shadow:0 0 0 1.5px #351E28;display:flex;align-items:center;justify-content:center;font:900 10px/1 Inter,sans-serif}
.bad .tag{top:4px;right:4px;width:22px;height:22px;font-size:13px}
.t{font-size:12px;line-height:1.25;font-weight:600;margin-top:5px}
</style></head><body>
<span class="lbl">Sebelum</span>
<div class="scr bad"><h1>Profil</h1><div class="shelf"><p class="g">Tamat</p><div class="row">
<div class="bk"><div class="cover c1">L</div><span class="tag">✓</span><div class="t">The Lighthouse Keeper</div></div>
<div class="bk"><div class="cover c2">A</div><span class="tag">✓</span><div class="t">A Tale of Two</div></div>
<div class="bk"><div class="cover c3">星の王子</div><span class="tag">✓</span><div class="t">星の王子さま</div></div>
</div></div></div>
<span class="lbl">Sesudah</span>
<div class="scr"><h1>Profil</h1><div class="shelf"><p class="g">Tamat</p><div class="row">
<div class="bk"><div class="cover c1">L</div><span class="tag">✓</span><div class="t">The Lighthouse Keeper</div></div>
<div class="bk"><div class="cover c2">A</div><span class="tag">✓</span><div class="t">A Tale of Two</div></div>
<div class="bk"><div class="cover c3">星の王子</div><span class="tag">✓</span><div class="t">星の王子さま</div></div>
</div></div></div>
</body></html>

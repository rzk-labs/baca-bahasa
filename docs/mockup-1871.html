<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1871</title>
<style>
body{margin:0;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28;padding:16px}
.lbl{font:700 12px Inter,sans-serif;margin:12px auto 6px;width:390px}
.ph{width:390px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:14px 20px 20px;box-sizing:border-box}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chip{height:30px;padding:0 12px;border-radius:99px;background:#E9F056;font-size:12px;font-weight:800;display:inline-flex;align-items:center}
.x{width:36px;height:36px;border-radius:50%;background:#f1e9ec;display:grid;place-items:center;font-weight:700}
.art{width:160px;height:120px;background:#D7EFFF;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;font-size:13px}
h2{font:800 22px 'Bricolage Grotesque',Inter,sans-serif;margin:6px 0}
.m{font-size:13px;opacity:.75;margin:0 0 8px}
.b{display:block;width:100%;height:48px;border-radius:99px;border:0;background:#351E28;color:#fff;font-weight:700;margin-top:8px}
.b.s{background:#f1e9ec;color:#351E28}
</style></head><body>
<div class="lbl">Sebelum (Tamat dua kali)</div>
<div class="ph"><div class="head"><span class="chip">Tamat</span><span class="x">✕</span></div><div class="art">Gambar tamat</div><h2>Tamat! Keren banget</h2><p class="m">Besok: baca 3 halaman, dapat lencana Kutubuku</p><button class="b">Buku baru</button><button class="b s">Lihat kata</button></div>
<div class="lbl">Sesudah (judul satu kali, tombol tutup di kanan)</div>
<div class="ph"><div class="head" style="justify-content:flex-end"><span class="x">✕</span></div><div class="art">Gambar tamat</div><h2>Tamat! Keren banget</h2><p class="m">Besok: baca 3 halaman, dapat lencana Kutubuku</p><button class="b">Buku baru</button><button class="b s">Lihat kata</button></div>
</body></html>

<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Mockup #1592 — Sampul polos judul Korea/CJK</title>
<style>
body{margin:0;background:#FAF7F0;color:#351E28;font:16px/1.4 Inter,system-ui,sans-serif;width:390px;padding:16px;box-sizing:border-box}
h1{font:700 20px/1.2 "Bricolage Grotesque",Inter,sans-serif;margin:0 0 4px}
.note{font-size:13px;margin:0 0 16px}
.lbl{display:inline-block;background:#E9F056;color:#351E28;font:600 12px Inter,sans-serif;padding:2px 8px;border-radius:99px;margin:12px 0 8px}
.row{display:flex;gap:12px}
.cover{width:132px;aspect-ratio:2/3;border-radius:10px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.ct{font:700 15px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.a{background:#D7EFFF}.b{background:#351E28;color:#FAF7F0}
.before .ct{word-break:break-all}
.after .ct{word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.after .jp{word-break:break-all}
small{display:block;font-size:12px;margin-top:4px}
</style></head><body>
<h1>Sampul polos judul Korea</h1>
<p class="note">Gambaran: judul tak lagi patah jadi satu huruf sisa.</p>
<span class="lbl">Sebelum</span>
<div class="row before">
<div><div class="cover a"><span class="ct">우산을 두고 온<br>날</span></div><small>Satu huruf sisa</small></div>
</div>
<span class="lbl">Sesudah</span>
<div class="row after">
<div><div class="cover a"><span class="ct">우산을 두고<br>온 날</span></div><small>Korea: patah per kata</small></div>
<div><div class="cover b"><span class="ct jp">吾輩は<br>猫である</span></div><small>Jepang: seimbang</small></div>
</div>
</body></html>

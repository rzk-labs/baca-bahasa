<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;padding:16px;background:#e9e4e6;font:400 14px/20px Inter,system-ui,sans-serif;color:#351E28}

</div>

<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #2010</title>
<style>
body{margin:0;background:#D7EFFF;font:14px/1.4 Inter,system-ui,sans-serif;color:#351E28;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:16px}
.ph{width:390px;background:#fff;border-radius:20px;padding:16px;box-sizing:border-box}
.tag{display:inline-block;background:#E9F056;color:#351E28;font:800 11px/1 Inter,sans-serif;padding:4px 8px;border-radius:99px;margin-bottom:10px}

.eb{font:700 12px/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:16px;background:#F3EEF0;margin-bottom:8px}
.row b{display:block;font:800 15px/18px "Bricolage Grotesque",sans-serif}
.nb{flex:1}.bar{height:8px;margin-top:6px;background:#351E28;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#E9F056}
.np{font:800 13px Inter,sans-serif}
details{border:1px solid #351E28;border-radius:12px;padding:10px 12px}
.mut{opacity:.65;font-size:12px}
</style>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1409</title>
<style>
body{margin:0;padding:16px;background:#eee;font-family:Inter,system-ui,sans-serif;color:#351E28}
.note{width:390px;font:600 12px/1.4 Inter,sans-serif;background:#E9F056;border-radius:8px;padding:8px 10px;margin:0 0 16px;box-sizing:border-box}
.lbl{font:700 12px/1 Inter,sans-serif;margin:0 0 8px}
.ph{width:390px;margin:0 0 24px;background:#D7EFFF;border-radius:20px;padding:16px;box-sizing:border-box}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3>div{border-radius:20px;padding:12px 10px;text-align:center;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;overflow:hidden;box-sizing:border-box}
.eyebrow{font:700 12px/16px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:rgba(53,30,40,.75);white-space:nowrap}
.lbl2{font:700 12px/14px Inter,sans-serif;display:flex;flex-direction:column}
.num{font:800 28px/30px "Bricolage Grotesque",sans-serif}
.lime{background:#E9F056}.lav{background:#fff}.pk{background:#FFD6E0}
.ring{position:relative;width:72px;height:72px}.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.score{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.gn{font:800 19px/19px "Bricolage Grotesque",sans-serif}.score small{font:700 9px/9px Inter,sans-serif;letter-spacing:.04em;color:#6b5a62}
.old .eyebrow{white-space:normal}.old .ring,.old .ring svg{width:64px;height:64px}.old .ring circle{stroke-width:8}.old .gn{font-size:20px}
</style></head><body>
<div class="note">Hasil #1409: kartu Target di Home. Judul satu baris, cincin lebih lega.</div>

<p class="lbl">Sebelum (judul dua baris, cincin sesak)</p>
<div class="ph old"><div class="stat3">
<div class="pk"><div class="eyebrow">Streak</div><div class="num">4</div><div class="lbl2">hari</div></div>
<div class="lime"><div class="eyebrow">Target<br>harian</div><div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" stroke="rgba(53,30,40,.14)"/></svg><div class="score"><span class="gn">0</span><small>XP</small></div></div><div class="lbl2"><span>XP hari ini</span><span>target 20</span></div></div>
<div class="lav"><div class="eyebrow">Level</div><div class="num">3</div><div class="lbl2">257 XP</div></div>
</div></div>

<p class="lbl">Sesudah (judul satu baris, cincin lega, tinggi sama)</p>
<div class="ph"><div class="stat3">
<div class="pk"><div class="eyebrow">Streak</div><div class="num">4</div><div class="lbl2">hari</div></div>
<div class="lime"><div class="eyebrow">Target</div><div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" stroke="rgba(53,30,40,.14)"/></svg><div class="score"><span class="gn">0</span><small>XP</small></div></div><div class="lbl2"><span>XP hari ini</span><span>target 20</span></div></div>
<div class="lav"><div class="eyebrow">Level</div><div class="num">3</div><div class="lbl2">257 XP</div></div>
</div></div>
</body></html>

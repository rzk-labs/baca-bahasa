<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1877 Sheet Tamat</title>
<style>
body{margin:0;background:#D7EFFF;font:15px/1.4 Inter,system-ui,sans-serif;color:#351E28;padding:16px}
.lbl{font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:16px auto 6px;width:390px;max-width:100%}
.sheet{width:390px;max-width:100%;margin:0 auto;background:#fff;border-radius:20px;padding:16px 20px 28px;box-sizing:border-box}
.chip{display:inline-block;background:#E9F056;border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px}
h2{font:700 22px/1.2 "Bricolage Grotesque",Inter,sans-serif;margin:10px 0 6px}
.mut{color:#6b5560;font-size:13px;margin:0 0 6px}
.pri{display:block;width:100%;min-height:44px;border:0;border-radius:14px;background:#351E28;color:#fff;font:600 15px Inter,sans-serif;padding:10px 16px;text-align:left;margin-top:12px}
.pri small{display:block;font-weight:400;opacity:.85;font-size:12px}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.lnk{background:none;border:0;color:#351E28;text-decoration:underline;font:600 14px Inter,sans-serif;min-height:44px;padding:0 8px}
.end{flex-wrap:nowrap;align-items:center;gap:0 4px}
.dot{color:#6b5560}
.old .pri2{display:block;width:100%;min-height:44px;border:2px solid #351E28;border-radius:14px;background:#fff;font:600 15px Inter;margin-top:8px}
.old .card{background:#D7EFFF;border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between}
.old small{display:block;font-size:11px;opacity:.75}
</style></head><body>
<div class="lbl">Sebelum</div>
<div class="sheet old">
<span class="chip">Tamat</span>
<p class="mut">10 bagian · 2 kata baru</p>
<h2>Tamat! Keren banget</h2>
<p class="mut">Tidak ada kata baru kali ini.</p>
<div class="card"><span>2 kata lama siap diulang</span><b>Ulang sekarang</b></div>
<button class="pri" style="margin-top:6px">Coba buku contoh<small>Jepang · The Lighthouse · Belum mulai</small></button>
<button class="pri2">Ulang 2 kata siap</button>
<div class="row"><button class="lnk">Baca ulang<small>tanpa XP</small></button><button class="lnk">Ke Home</button></div>
</div>
<div class="lbl">Sesudah</div>
<div class="sheet">
<span class="chip">Tamat</span>
<p class="mut">10 bagian · 2 kata belum disimpan</p>
<h2>Tamat! Keren banget</h2>
<p class="mut">2 kata belum disimpan.</p>
<button class="pri">Coba buku contoh<small>Jepang · The Lighthouse · Belum mulai</small></button>
<div class="row"><button class="lnk">Ulang 2 kata siap</button><button class="lnk">Buku baru</button></div>
<div class="row end"><button class="lnk">Baca ulang (tanpa XP)</button><span class="dot">·</span><button class="lnk">Ke Home</button></div>
</div>
</body></html>

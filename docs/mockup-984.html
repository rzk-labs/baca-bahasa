<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Mockup #984: visual loading Keepo HQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#D7EFFF;color:#351E28;font:15px/1.5 Inter,system-ui,sans-serif;width:390px;padding:0 0 24px}
.lbl{display:inline-block;margin:14px 16px 8px;padding:2px 10px;border-radius:999px;background:#351E28;color:#FFF8EE;font-size:12px;font-weight:700}
.scr{position:relative;margin:0 12px;border:1.5px solid #351E28;border-radius:20px;background:#D7EFFF;padding:18px 14px;overflow:hidden}
.bar{position:absolute;top:0;left:0;right:0;height:3px}.bar i{display:block;width:40%;height:100%;margin-left:30%;background:#E9F056;border-bottom:1px solid #351E28}
h1{font:800 26px/1.1 "Bricolage Grotesque",Inter,sans-serif;margin:6px 0 12px}
.sk{border-radius:20px;background:linear-gradient(90deg,#E4F3FF,#B9D3E6,#E4F3FF);margin-bottom:12px}
.card{background:#FFF8EE;border:1.5px solid #351E28;border-radius:18px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #351E28;background:#351E28;color:#FFF8EE;font:700 15px Inter,sans-serif}
.btn.off{opacity:.6}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.err{border-left:3px solid #351E28;padding-left:8px;font-weight:700;font-size:14px;margin:0 0 10px}
small{color:#5d4753}
</style></head><body>
<span class="lbl">Memuat Detail tugas</span>
<div class="scr"><div class="bar"><i></i></div><h1>Tugas #984</h1>
<div class="sk" style="height:36px;width:40%;border-radius:999px"></div><div class="sk" style="height:160px"></div><div class="sk" style="height:200px"></div></div>
<span class="lbl">Tombol sedang bekerja</span>
<div class="scr"><div class="bar"><i></i></div><h1>Markas</h1>
<div class="card"><b>PM agent</b><br><small>Menyusun tugas berikutnya</small><br><br><span class="btn off"><i class="dot"></i> PM sedang bekerja…</span></div></div>
<span class="lbl">Gagal memuat</span>
<div class="scr"><h1>Dokumen</h1><p class="err">Koneksi putus. Coba muat ulang.</p><span class="btn">Coba lagi</span></div>
</body></html>

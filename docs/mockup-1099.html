<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1099 Sosial</title>
<style>
body{margin:0;background:#eee;font-family:Inter,system-ui,sans-serif;color:#351E28;padding:16px}
.lbl{font:600 12px Inter,sans-serif;text-align:center;margin:0 0 6px;color:#5F5059}
.ph{width:390px;height:700px;margin:0 auto 24px;background:#D7EFFF;border-radius:26px;display:flex;flex-direction:column;overflow:hidden}
.hd{padding:14px 16px;font:800 22px "Bricolage Grotesque",Inter,sans-serif}
.empty{flex:1;text-align:center;padding:96px 24px 24px}
.empty h2{margin:0 0 6px;font:700 20px "Bricolage Grotesque",Inter,sans-serif}
.mut{color:#5F5059;font-size:14px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

.pri{background:#351E28;color:#FAF7F0}
nav{display:flex;height:76px;background:#FAF7F0;border-top:1px solid #B2CFE2}
nav span{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#5F5059}
nav .on{color:#351E28;font-weight:700;box-shadow:inset 0 3px 0 #E9F056}
</style></head><body>
<p class="lbl">Sesudah: Sosial belum siap (tab Sosial tetap aktif)</p>
<div class="ph"><div class="hd">Keepo</div>
<div class="empty"><h2>Sosial lagi dimuat</h2><div class="mut">Sambungannya belum siap. Coba lagi ya.</div>
<div class="row"><button class="pri">Coba lagi</button><button>Kembali ke Home</button></div></div>
<nav><span>Home</span><span>Baca</span><span>Ngomong</span><span>Kata</span><span class="on">Sosial</span></nav></div>

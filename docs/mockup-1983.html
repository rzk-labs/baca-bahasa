<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Mockup #1983</title>
<style>
body{margin:0;padding:16px;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28;display:flex;gap:16px;flex-wrap:wrap}
.ph{width:390px;box-sizing:border-box;background:#fff;border-radius:20px;padding:16px}
.lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#E9F056;display:inline-block;padding:2px 8px;border-radius:6px;margin-bottom:10px}

.tile{background:#351E28;color:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
.tile b{font-size:32px}.tile small{opacity:.8}
.lv{background:#D7EFFF;color:#351E28}
.row{display:flex;gap:10px}.row .tile{flex:1}
.mut{font-size:13px;opacity:.8}
.fr{display:flex;justify-content:space-around;text-align:center}.fr b{display:block;font-size:22px}
</style></head><body>
<div class="ph"><span class="lab">Home</span><h2>Hari ini</h2>

<div class="tile lv"><div class="mut">Level</div><b>10</b><div class="mut">40/100 XP → Lv 11</div></div></div></div>
<div class="ph"><span class="lab">Profil (sesudah: sama dengan Home)</span><h2>Profil</h2>
<div><b>Dina</b><div class="mut">@dina · Level 10 · privat</div></div><br>
<div class="fr"><div><b>11</b><span class="mut">hari berturut</span></div><div><b>14</b><span class="mut">kata 7 hari</span></div><div><b>3</b><span class="mut">pengikut</span></div><div><b>5</b><span class="mut">mengikuti</span></div></div></div>
</body></html>

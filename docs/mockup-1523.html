<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Mockup #1523 — Minggu ini</title>
<style>
body{margin:0;background:#D7EFFF;font-family:Inter,system-ui,sans-serif;color:#351E28}
.ph{width:390px;margin:0 auto;padding:16px;box-sizing:border-box}
h1{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:20px;margin:8px 0 16px}
.lb{display:inline-block;font-size:11px;font-weight:700;background:#E9F056;color:#351E28;border-radius:6px;padding:2px 8px;margin:12px 0 6px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(53,30,40,.12)}
.wk-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.wk-t{font-weight:700;font-family:'Bricolage Grotesque',Inter,sans-serif;width:100%}
.wk-c{background:#D7EFFF;border-radius:999px;padding:4px 10px;font-size:13px}
.wk-c b{font-weight:700}
.bad .wk-c:first-child{background:#E9F056}
.gh{font-size:12px;color:#351E28;opacity:.7;border:1px solid #351E28;border-radius:8px;padding:4px 8px;margin-top:6px;background:none}
.n{font-size:12px;opacity:.7;margin:6px 2px}
</style></head><body><div class="ph">
<h1>Home — kartu “Minggu ini”</h1>
<div class="lb">Sebelum</div>
<div class="card bad"><div class="wk-h"><span class="wk-t">Minggu ini</span><span class="wk-c"><b>192</b> halaman</span><span class="wk-c"><b>1</b> kata baru</span><span class="wk-c"><b>3</b> hari baca</span></div><button class="gh">Sembunyikan</button></div>
<p class="n">Buku hanya 12 halaman, tapi angka membengkak.</p>
<div class="lb">Sesudah</div>
<div class="card"><div class="wk-h"><span class="wk-t">Minggu ini</span><span class="wk-c"><b>12</b> halaman</span><span class="wk-c"><b>1</b> kata baru</span><span class="wk-c"><b>3</b> hari baca</span></div><button class="gh">Sembunyikan</button></div>
<p class="n">Baca ulang semua halaman 2 kali tetap 12.</p>
</div></body></html>

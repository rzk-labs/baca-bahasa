<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1632 — Home buku tamat</title>
<style>
body{margin:0;padding:16px;background:#e9e4e6;font:14px/20px Inter,system-ui,sans-serif;color:#351E28}
.wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.col small{display:block;margin:0 0 8px;font:700 12px/16px Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.ph{width:390px;box-sizing:border-box;background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font:800 20px/24px "Bricolage Grotesque",Inter,sans-serif;margin:0}
.hero{background:#351E28;color:#fff;border-radius:20px;padding:14px}
.hero b{display:block;font:800 17px/22px "Bricolage Grotesque",Inter,sans-serif}
.hero span{opacity:.8;font-size:13px}
.btn{display:block;margin-top:10px;min-height:44px;line-height:44px;text-align:center;border-radius:14px;background:#E9F056;color:#351E28;font-weight:700}
.row{display:flex;gap:10px}.row div{flex:1;border-radius:16px;padding:12px;font-weight:700}
.lime{background:#E9F056}.lav{background:#D9D0F5}
.nudge{min-height:44px;box-sizing:border-box;padding:12px 14px;border-left:4px solid #E9F056;border-radius:16px;background:#D7EFFF;font-weight:700;display:flex;align-items:center}
.nudge.x{outline:2px dashed #c0392b}
.note{font-size:12px;color:#c0392b;font-weight:700}
</style></head><body>
<div class="wrap">
<div class="col"><small>Sebelum</small><div class="ph">
<h1>Beranda</h1>
<div class="hero"><b>Buku tamat! 🎉</b><span>Si Kancil — 100%</span><div class="btn">Pilih buku berikutnya</div></div>
<div class="row"><div class="lime">Target<br>3/5 kata</div><div class="lav">Level 2<br>120 XP</div></div>
<div class="nudge x">Pilih buku berikutnya</div>
<div class="note">Tombol dobel</div>
</div></div>
<div class="col"><small>Sesudah</small><div class="ph">
<h1>Beranda</h1>
<div class="hero"><b>Buku tamat! 🎉</b><span>Si Kancil — 100%</span><div class="btn">Pilih buku berikutnya</div></div>
<div class="row"><div class="lime">Target<br>3/5 kata</div><div class="lav">Level 2<br>120 XP</div></div>
<div class="nudge">5 kata siap diulang · Ulang sekarang</div>
</div></div>
</div>
</body></html>

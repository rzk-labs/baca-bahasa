<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1800 — Cincin Target baca</title>
<style>
body{margin:0;padding:16px;background:#eee;font-family:Inter,system-ui,sans-serif;color:#351E28}
.note{max-width:390px;margin:0 auto 12px;font-size:12px;font-weight:700;background:#E9F056;padding:6px 10px;border-radius:8px}
.lab{max-width:390px;margin:14px auto 6px;font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.phone{width:390px;max-width:100%;margin:0 auto;background:#FAF7F0;border-radius:24px;padding:20px;box-sizing:border-box}
h1{font:800 22px "Bricolage Grotesque",Inter,sans-serif;margin:0 0 14px}
.card{background:#AEB8A0;border-radius:20px;padding:16px;width:170px}
.eyebrow{font:700 11px Inter;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.bg{stroke:rgba(53,30,40,.14)}.fg{stroke:#351E28}
.score{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 15px Inter}
.score small{font:700 10px/10px Inter}
.l{font:600 13px Inter;margin-top:8px}.eg{font:600 12px Inter;opacity:.8;margin-top:2px}
</style></head><body>
<div class="note">Gambaran rencana, belum dibangun</div>

<div class="lab">Sebelum: 0 mnt tapi cincin terisi</div>
<div class="phone"><h1>Home</h1><div class="card"><div class="eyebrow">Target baca</div>
<div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="122"/></svg><div class="score">0<small>mnt</small></div></div>
<div class="l">0 dari 5 menit</div><div class="eg">Sisa 5 menit</div></div></div>

<div class="lab">Sesudah: 0 mnt = cincin kosong</div>
<div class="phone"><h1>Home</h1><div class="card"><div class="eyebrow">Target baca</div>
<div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"/></svg><div class="score">0<small>mnt</small></div></div>
<div class="l">0 dari 5 menit</div><div class="eg">Sisa 5 menit</div></div></div>

<div class="lab">Sesudah: 1 mnt = 20%</div>
<div class="phone"><h1>Home</h1><div class="card"><div class="eyebrow">Target baca</div>
<div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="130.7"/></svg><div class="score">1<small>mnt</small></div></div>
<div class="l">1 dari 5 menit</div><div class="eg">Sisa 4 menit</div></div></div>
</body></html>

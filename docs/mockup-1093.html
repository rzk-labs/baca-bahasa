<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup #1093 — Akun Premium chiko</title>
<style>
body{margin:0;background:#eee;font-family:Inter,system-ui,sans-serif;color:#351E28}
.wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:16px}
.note{width:100%;text-align:center;font-size:13px;background:#E9F056;padding:8px;border-radius:8px;max-width:820px}
.col{width:390px}
.lbl{font-size:12px;font-weight:700;margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}

.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;flex-wrap:wrap}
.sub{font-size:13px;opacity:.7;margin-top:4px}
.badge{background:#351E28;color:#E9F056;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid #eee}
.row:last-child{border:0}
.hl{background:#E9F056;padding:0 6px;border-radius:4px;font-weight:700}
</style></head><body>
<div class="wrap">
<div class="note">Gambaran rencana, belum dibangun</div>
<div class="col"><p class="lbl">Sebelum — akun biasa</p>
<div class="phone"><h1>Profil</h1>
<div class="card"><div class="name">rina_baca</div><div class="sub">Level 3 · Streak 4 hari</div></div>
<div class="card"><div class="row"><span>Nama panggilan</span><span>Rina</span></div><div class="row"><span>Profil publik</span><span>Ya</span></div></div></div></div>
<div class="col"><p class="lbl">Sesudah — akun chiko (owner)</p>
<div class="phone"><h1>Profil</h1>
<div class="card"><div class="name">chiko <span class="badge">★ Premium</span></div><div class="sub">Level 7 · Streak 21 hari</div></div>
<div class="card"><div class="row"><span>Nama panggilan</span><span>Chiko</span></div><div class="row"><span>Profil publik</span><span>Ya</span></div><div class="row"><span>Paket</span><span class="hl">Premium (khusus owner)</span></div></div></div></div>
</div></body></html>

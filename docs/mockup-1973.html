<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Mockup #1973: Lencana berikutnya di Home</title>
<style>
:root{--plum:#351E28;--ice:#D7EFFF;--hl:#E9F056;--ink:#351E28}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#eee;font:400 14px/20px Inter,system-ui,sans-serif;color:var(--ink)}
.lbl{font:700 11px/16px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 auto 6px;width:390px}
.phone{width:390px;margin:0 auto 24px;background:#fff;padding:16px;border-radius:24px}
h1{font:800 26px/30px "Bricolage Grotesque",Inter,sans-serif;margin:0 0 12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3>div{border-radius:20px;padding:12px;min-height:96px;font-weight:700}
.stat3 small{display:block;font-weight:500;font-size:12px}
.a{background:var(--hl)}.b{background:#cdeaa0}.c{background:#e3d9ff}
.nb-line{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:10px 0 0;padding:8px 12px;border:0;border-radius:20px;background:var(--ice);color:var(--ink);font:600 13px/18px Inter,sans-serif;text-align:left}
.nb-line svg{flex:none;width:18px;height:18px}
.nb-line span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw{margin-top:12px;padding:12px 14px;border-left:4px solid var(--hl);border-radius:20px;background:var(--ice);font-weight:700}
</style></head><body>
<div class="lbl">Sesudah: Home dengan satu baris lencana</div>
<div class="phone">
<h1>Home</h1>
<div class="stat3">
<div class="a">Streak<small>2 hari</small></div>
<div class="b">Target<small>3 / 5 menit</small></div>
<div class="c">Level 2<small>40 XP</small></div>
</div>
<button class="nb-line" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h7a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H4zM20 5h-6"/></svg><span>Lencana berikutnya: <b>Kutu Buku</b> · sisa 6 halaman</span></button>
<div class="fw">3 kata siap diulang</div>
</div>
<div class="lbl">Ketuk baris: daftar lencana</div>
<div class="phone">
<h1>Lencana</h1>
<ul><li><b>Keepo Pertama</b> · sudah kebuka</li><li><b>Kutu Buku</b> · Balik 20 halaman di tab Baca. (14/20)</li><li><b>Berani Ngomong</b> · Buka tab Ngomong, selesaikan 1 tantangan.</li></ul>
</div>
</body></html>

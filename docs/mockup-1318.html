<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1318 — Kartu Level</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#eee;font:400 14px/1.4 Inter,system-ui,sans-serif;color:#351E28}
.lab{font:700 12px/1 Inter,sans-serif;margin:0 0 8px;color:#555}
.phone{width:390px;max-width:100%;background:#FAF7F0;border-radius:20px;padding:16px;margin:0 auto 20px}
.phone.s{width:320px}
h1{font:800 20px/1.2 "Bricolage Grotesque",Inter,sans-serif;margin:0 0 12px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3>div{padding:12px 10px;border-radius:16px;overflow:hidden}
.eyebrow{font-size:12px;font-weight:700;opacity:.8}
.num{font:800 32px/1.1 "Bricolage Grotesque",Inter,sans-serif;margin-top:4px}
.sun{background:#EFEBCB}.lime{background:#AEB8A0}.lav{background:#C3E1F4}
.bar{height:6px;border-radius:99px;background:#351E28;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#E9F056;border-radius:inherit}
.l{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:16px;font-weight:700;margin-top:6px;white-space:nowrap}
.l b{font-weight:600}.s .l b{display:none}
.note{font-size:12px;margin-top:6px;opacity:.8}
</style></head><body>
<p class="lab">Sesudah (HP 390px)</p>
<div class="phone"><h1>Profil</h1><div class="stat3">
<div class="sun"><div class="eyebrow">Streak</div><div class="num">7</div><div class="note">hari</div></div>
<div class="lime"><div class="eyebrow">Target</div><div class="num">10</div><div class="note">XP hari ini</div></div>
<div class="lav"><div class="eyebrow">Level</div><div class="num">5</div><div class="bar"><i style="width:64%"></i></div><div class="l"><span>64/100 XP</span><b>→ Lv 6</b></div></div>
</div></div>
<p class="lab">Sesudah (layar kecil 320px: hanya XP)</p>
<div class="phone s"><h1>Profil</h1><div class="stat3 s">
<div class="sun"><div class="eyebrow">Streak</div><div class="num">7</div></div>
<div class="lime"><div class="eyebrow">Target</div><div class="num">10</div></div>
<div class="lav s"><div class="eyebrow">Level</div><div class="num">5</div><div class="bar"><i style="width:64%"></i></div><div class="l"><span>64/100 XP</span><b>→ Lv 6</b></div></div>
</div></div>
</body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup #1547 — Fokus terkunci di sheet</title>
<style>
body{margin:0;background:#eee;font-family:Inter,system-ui,sans-serif;color:#351E28}
.lbl{font:600 12px Inter,sans-serif;text-align:center;padding:10px;color:#555}
.ph{width:390px;height:620px;margin:0 auto 16px;background:#fff;position:relative;overflow:hidden;border:1px solid #ccc}
.page{padding:24px;font-size:18px;line-height:1.7;color:#333}
.shade{position:absolute;inset:0;background:rgba(53,30,40,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:16px 20px 24px}
.grab{width:40px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 12px}
h2{font:700 22px 'Bricolage Grotesque',Inter,sans-serif;margin:0 0 4px}
p{margin:4px 0 14px;color:#555}
button{font:600 15px Inter,sans-serif;border:0;border-radius:12px;padding:12px 16px;background:#D7EFFF;color:#351E28;margin-right:8px}
.f{outline:2px solid #351E28;outline-offset:2px}
.note{font-size:12px;color:#555;margin-top:12px}
</style></head><body>
<div class="lbl">Sesudah dibangun: Tab berputar di dalam sheet, tak lari ke halaman belakang. Tampilan tak berubah.</div>
<div class="ph"><div class="page">Dia berjalan ke <b>pasar</b> pagi itu dan membeli apel untuk ibunya.</div><div class="shade"></div>
<div class="sheet"><div class="grab"></div><h2>pasar</h2><p>market</p><button>Simpan kata</button><button class="f">Dengar</button><div class="note">Tab dari tombol terakhir → balik ke tombol pertama. Shift+Tab sebaliknya. Esc menutup.</div></div></div>
</body></html>

<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keepo HQ</title>
<meta name="theme-color" content="#F2EEE5">
<link rel="icon" href="https://rzk-labs.github.io/baca-bahasa/icon-192.png">
<link rel="apple-touch-icon" href="https://rzk-labs.github.io/baca-bahasa/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,700;75,800;75,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#F2EEE5;--ink:#2A1215;--mut:#7a6a6b;--card:#FFFDF8;--line:#E3DBCC;--soft:#E9E3D6;
  --lime:#C6FF3D;--lav:#C9B8FF;--pink:#FFB8D9;--coral:#FF8A65;--sun:#FFE14D;--mint:#9EF0C9;--blue:#A9CFFF;
  --on:#2A1215;--shadow:0 1px 0 var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140D0F;--ink:#F4EFE6;--mut:#ad9d9e;--card:#1F1618;--line:#33272A;--soft:#2a1f22}}
:root[data-theme="dark"]{--bg:#140D0F;--ink:#F4EFE6;--mut:#ad9d9e;--card:#1F1618;--line:#33272A;--soft:#2a1f22}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:Archivo,sans-serif;font-stretch:75%;font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.95;margin:0}
h1{font-size:44px}h2{font-size:26px}h3{font-size:19px}
a{color:inherit}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
/* sidebar */
.side{display:none}
.main{padding:16px 16px 110px;max-width:1180px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:12px;background:var(--lav);border:2px solid var(--ink)}
.brand b{font-family:Archivo;font-stretch:75%;font-weight:900;font-size:24px;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;background:#2A1215;padding:6px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tabbar button{border:0;background:none;color:#F2EEE5;opacity:.65;padding:9px 13px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabbar button.on{background:var(--lime);color:#2A1215;opacity:1}
.tabbar svg{width:18px;height:18px}
@media (min-width:1000px){
  .app{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:2px solid var(--line)}
  .side .brand{margin-bottom:18px}
  .side nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:11px 14px;border-radius:14px;font-weight:700;cursor:pointer;text-align:left}
  .side nav button.on{background:var(--ink);color:var(--bg)}
  .side nav svg{width:19px;height:19px}
  .side .foot{margin-top:auto;font-size:12px;color:var(--mut)}
  .tabbar,.top .brand{display:none}
  .main{padding:28px 32px 48px}
}
/* blocks */
.grid{display:grid;gap:14px}
.bento{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:2px solid var(--ink);border-radius:24px;padding:18px;background:var(--card);position:relative;overflow:hidden;min-width:0}
.tile.c{color:var(--on)}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.t-lime{background:var(--lime)}.t-lav{background:var(--lav)}.t-pink{background:var(--pink)}.t-sun{background:var(--sun)}.t-mint{background:var(--mint)}.t-blue{background:var(--blue)}.t-coral{background:var(--coral)}.t-ink{background:#2A1215;color:#F2EEE5}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.big{font-family:Archivo;font-stretch:75%;font-weight:900;font-size:56px;line-height:.9}
.mut{color:var(--mut)}.sm{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.lime{background:var(--lime);color:#2A1215;border-color:#2A1215}
.tile.c .btn{border-color:#2A1215;background:#2A1215;color:#F2EEE5}.tile.c .btn.ghost{background:transparent;color:#2A1215}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.sec{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:28px 0 12px}
/* ring */
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(#2A1215 calc(var(--p)*1%),rgba(42,18,21,.15) 0);display:grid;place-items:center;flex:none}
.ring b{width:68px;height:68px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-family:Archivo;font-stretch:75%;font-weight:900;font-size:24px}
/* agents */
.agents{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.agent{display:flex;flex-direction:column;gap:10px}
.av{width:52px;height:52px;border-radius:16px;border:2px solid #2A1215;display:grid;place-items:center;font-size:26px;flex:none;position:relative}
.av .live{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--lime);border:2px solid #2A1215;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.7)}}
.agent .st{font-size:13px;font-weight:700;padding:8px 10px;border-radius:12px;background:var(--soft);min-height:38px}
.agent .st.on{background:var(--sun);color:#2A1215}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;border:1.5px solid #2A1215;color:#2A1215;white-space:nowrap;line-height:1.4}
.s-antre{background:var(--blue)}.s-dikerjakan{background:var(--sun)}.s-siap{background:var(--lime)}.s-gagal{background:var(--coral)}.s-live{background:var(--mint)}.s-ditolak{background:#d9d4cb}
.p-developer{background:var(--lime)}.p-riset{background:var(--blue)}.p-desain{background:var(--pink)}.p-pm{background:var(--lav)}.p-qa{background:var(--mint)}.p-marketing{background:var(--sun)}
.chip.o{background:transparent;color:var(--ink);border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.col{background:var(--soft);border-radius:22px;padding:12px;scroll-snap-align:start;min-height:200px}
.col.k-live .more-btn{width:100%;margin:2px 0 4px}
@media (max-width:759px){.col.k-siap{order:0}.col.k-dikerjakan{order:1}.col.k-antre{order:2}.col.k-menuju{order:3}.col.k-live{order:4}.col.k-gagal{order:5}}
.col h3{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 12px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card b{display:block;margin:6px 0 4px;line-height:1.3;overflow-wrap:anywhere}
/* timeline */
.feed{display:grid;gap:0}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1.5px dashed var(--line);align-items:flex-start}
.ev:last-child{border:0}
.ev .ic{width:34px;height:34px;border-radius:11px;border:2px solid #2A1215;display:grid;place-items:center;flex:none;font-size:16px}
.ev b{font-weight:700}
/* map */
.phase{margin-bottom:16px}
.phase-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stages{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stage{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid var(--ink);border-radius:16px;background:var(--card)}
.stage .no{font-family:Archivo;font-stretch:75%;font-weight:900;font-size:22px;width:34px;flex:none}
.stage b{display:block;line-height:1.25}
.k-selesai{background:var(--mint)}.k-draft,.k-berjalan{background:var(--sun)}.k-awal{background:var(--blue)}.k-belum{background:transparent;color:var(--ink);border-style:dashed}
.bar{height:10px;border-radius:99px;background:rgba(42,18,21,.15);overflow:hidden}.bar i{display:block;height:100%;background:#2A1215;border-radius:99px}
/* doc */
.doclist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.md{line-height:1.65;overflow-wrap:anywhere}.md h1,.md h2,.md h3{margin:22px 0 10px}.md h1{font-size:32px}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}.md td,.md th{border:1.5px solid var(--line);padding:6px 10px;text-align:left}
.md code{background:var(--soft);padding:1px 5px;border-radius:6px}.md pre{background:var(--soft);padding:12px;border-radius:12px;overflow-x:auto}
/* detail */
.msg{border-left:4px solid var(--lav);padding:4px 0 4px 14px;margin:14px 0}
.msg.kamu{border-color:var(--pink)}.msg small{display:block;color:var(--mut);font-weight:800;margin-bottom:2px}
textarea,input,select{width:100%;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;outline:none}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus,select:focus{box-shadow:0 0 0 3px var(--lime)}
.err{color:#d43d1a;font-weight:700;font-size:14px}
.back{border:0;background:none;font-weight:800;cursor:pointer;padding:6px 0;margin-bottom:8px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 16px max(20px,env(safe-area-inset-bottom));border:2px solid var(--ink);border-bottom:0;max-height:92vh;overflow:auto}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:28px;border-bottom:2px solid var(--ink)}}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.roles label{cursor:pointer}
.roles input{display:none}
.roles span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:2px solid var(--ink);border-radius:16px;font-weight:800;font-size:12px;text-align:center}
.roles span i{font-style:normal;font-size:22px}
.roles input:checked+span{background:var(--lime);color:#2A1215;border-color:#2A1215}
.empty{padding:22px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:18px}
.skel{height:120px;border-radius:24px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.fab{position:fixed;right:16px;bottom:88px;z-index:21}
@media (min-width:1000px){.fab{display:none}}

/* ADHD-friendly detail & dokumen */
.dt{display:grid;gap:14px;max-width:760px}
.dt .tile{padding:20px}
.hero .ttl{font-size:30px;margin:12px 0 6px;line-height:1}
.say{font-size:18px;font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.big-b{padding:13px 20px;font-size:16px}
.lbl{font-family:Archivo;font-stretch:75%;font-weight:900;text-transform:uppercase;font-size:20px;margin-bottom:8px}
.pts{margin:0;padding-left:22px;font-size:17px;line-height:1.6}
.pts li{margin:8px 0;padding-left:4px}
.pts.sm2{font-size:15px;margin-top:10px}
details>summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸';transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details.more>summary{color:var(--mut);margin-top:8px}
.note{display:inline-block;background:var(--sun);color:#2A1215;font-weight:800;padding:6px 12px;border-radius:12px;margin-bottom:12px}
.read{max-width:720px;font-size:17px;line-height:1.75;padding:24px}
.read h1{font-size:34px;margin:0 0 14px}
.read h3{margin:18px 0 6px;font-size:20px}
.read p{margin:10px 0}
.read li{margin:6px 0}
.read details{border-top:2px solid var(--line);padding:14px 0}
.read details>summary{font-family:Archivo;font-stretch:75%;font-weight:900;text-transform:uppercase;font-size:22px;line-height:1.1}
.read details[open]>summary{margin-bottom:8px}
@media (max-width:600px){.hero .ttl{font-size:26px}.big-b{flex:1}.read{padding:18px;font-size:16.5px}}
.hk .pts{margin-top:4px}
.hf .chip{cursor:pointer;border:2px solid var(--ink);background:none;font:inherit;font-weight:800}
.hf .chip.on{background:var(--ink);color:var(--bg)}
</style></head><body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="https://rzk-labs.github.io/baca-bahasa/img/kepo-icon.webp" alt=""><div><b>Keepo HQ</b><small>Markas tim agent</small></div></div>
    <nav id="sidenav"></nav>
    <button class="btn lime" style="margin-top:14px" onclick="perintah()">＋ Perintah ke tim</button>
    <div class="foot">Live: <a href="https://rzk-labs.github.io/baca-bahasa/" target="_blank">rzk-labs.github.io/baca-bahasa</a></div>
  </aside>
  <main class="main">
    <div class="top"><div class="brand"><img src="https://rzk-labs.github.io/baca-bahasa/img/kepo-icon.webp" alt=""><div><b>Keepo HQ</b><small>Markas tim agent</small></div></div></div>
    <div id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<button class="btn lime fab" id="fab" onclick="perintah()" style="display:none">＋ Perintah</button>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s), V=$('#view');
let tok=''; try{tok=localStorage.getItem('kd_tok')||''}catch(e){}
let HQ=null, timer=null, cur='markas';
const IC={
  markas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  papan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/></svg>',
  peta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  dokumen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  hasil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>'
};
const NAV=[['markas','Markas'],['hasil','Hasil'],['papan','Papan'],['peta','Peta'],['dokumen','Dokumen']];
const TIM={
  pm:{n:'PM',e:'🧭',c:'t-lav',d:'Memilih tugas harian dari roadmap'},
  riset:{n:'Riset',e:'🔎',c:'t-blue',d:'Pasar, kompetitor, persona'},
  desain:{n:'Desain',e:'🎨',c:'t-pink',d:'UX/UI, alur, brand'},
  developer:{n:'Developer',e:'🛠️',c:'t-lime',d:'Menulis kode aplikasi'},
  marketing:{n:'Marketing',e:'📣',c:'t-sun',d:'Threads IG asbun, cari tester'},
  qa:{n:'QA',e:'🧪',c:'t-mint',d:'Memeriksa setiap hasil'}
};
const UJI=[
  {n:'Tari',e:'🔍',c:'t-blue',d:'Tester · tampilan HP'},
  {n:'Bima',e:'🧪',c:'t-mint',d:'Tester · data & offline'},
  {n:'Nadia',e:'📖',c:'t-pink',d:'Pengguna · mahasiswi, Inggris A2'},
  {n:'Raka',e:'💼',c:'t-sun',d:'Pengguna · karyawan, Korea/Jepang B1'},
  {n:'Dina',e:'🗂️',c:'t-lav',d:'Pengguna Keepo HQ · founder sibuk'}
];
const ST={menuju:'Menuju live',antre:'Antre',dikerjakan:'Dikerjakan',siap:'Siap dicek',gagal:'Gagal',live:'Live',ditolak:'Ditolak'};
const KS={selesai:'Selesai',draft:'Draft',berjalan:'Berjalan',awal:'Awal',belum:'Belum'};
const BOBOT={selesai:1,draft:.6,berjalan:.5,awal:.3,belum:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tgl=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function lalu(t){const m=Math.round((Date.now()-new Date(t))/6e4);if(m<1)return'barusan';if(m<60)return m+' mnt lalu';const h=Math.round(m/60);if(h<24)return h+' jam lalu';return Math.round(h/24)+' hari lalu'}
const chipS=t=>`<span class="chip s-${t.status}">${t.status==='dikerjakan'?'<i class="dot"></i>':''}${ST[t.status]}</span>`;
const chipP=p=>`<span class="chip p-${p}">${TIM[p]?.e||''} ${TIM[p]?.n||p}</span>`;
const chipQ=q=>q?`<span class="chip o">${q==='lolos'?'✅ QA lolos':'⚠️ QA catatan'}</span>`:'';

async function call(path,body,coba=0){
  let r;try{r=await fetch('/api'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:body?JSON.stringify(body):undefined})}catch(e){r=null}
  if((!r||r.status>=500)&&!body&&coba<2){await new Promise(z=>setTimeout(z,1500));return call(path,body,coba+1)}
  if(!r)throw new Error('Koneksi putus. Coba muat ulang.');
  const d=await r.json().catch(()=>({}));
  if(r.status>=500)throw new Error(d.error||'Server sedang sibuk. Muat ulang sebentar lagi.');
  if(r.status===401&&path!=='/login'){tok='';login();throw new Error('Perlu login')}
  if(!r.ok)throw new Error(d.error||'Gagal ('+r.status+')');
  return d;
}
function navs(){
  const b=(k,l)=>`<button class="${cur===k?'on':''}" onclick="go('${k}')">${IC[k]}<span>${l}</span></button>`;
  $('#sidenav').innerHTML=NAV.map(([k,l])=>b(k,l)).join('');
  $('#tabbar').innerHTML=NAV.map(([k,l])=>b(k,l)).join('');
  $('#fab').style.display=tok?'':'none';
}
function go(k,arg){clearTimeout(timer);cur=k;navs();scrollTo(0,0);
  if(k==='markas')markas();else if(k==='papan')papan();else if(k==='peta')peta();else if(k==='dokumen')dokumen(arg);else if(k==='hasil')hasilKerja();
  try{history.replaceState(null,'','#'+k+(arg?'/'+arg:''))}catch(e){}
}
async function load(){HQ=await call('/hq');return HQ}
function auto(fn){clearTimeout(timer);const sibuk=HQ&&(HQ.tasks.some(t=>t.status==='antre'||t.status==='dikerjakan')||(HQ.runs||[]).some(r=>r.status!=='completed'));timer=setTimeout(async()=>{try{await load();fn(true)}catch(e){}},sibuk?12000:60000)}
function skel(){V.innerHTML='<div class="bento"><div class="skel span2"></div><div class="skel"></div><div class="skel"></div></div><div class="skel" style="margin-top:14px;height:220px"></div>'}

function login(){
  clearTimeout(timer);$('#fab').style.display='none';
  V.innerHTML=`<div class="tile t-lav c" style="max-width:440px;margin:8vh auto 0"><div class="eyebrow">Khusus founder</div><h1 style="margin:6px 0 14px">Masuk markas</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button class="btn" id="go">Masuk</button><span id="e" class="err"></span></div></div>`;
  const f=async()=>{try{const d=await call('/login',{pw:$('#pw').value});tok=d.token;try{localStorage.setItem('kd_tok',tok)}catch(e){};go('markas')}catch(e){$('#e').textContent=e.message}};

function nextPM(){const d=new Date();d.setUTCHours(1,0,0,0);if(d<=new Date())d.setUTCDate(d.getUTCDate()+1);return d}
function progres(r){if(!r)return 0;return Math.round(r.tahap.reduce((a,t)=>a+(BOBOT[t.status]||0),0)/r.tahap.length*100)}

async function markas(again){
  if(!again){if(!HQ)skel();try{await load()}catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>';return}}
  if(cur!=='markas')return;
  const T=HQ.tasks, R=HQ.roadmap, runs=HQ.runs;
  const siap=T.filter(t=>t.status==='siap'), jalan=T.filter(t=>t.status==='dikerjakan'||t.status==='antre');
  const live=T.filter(t=>t.status==='live').length, p=progres(R);
  const pmRun=(runs||[]).find(r=>r.jenis==='pm'&&r.status!=='completed');
  const kerjaRun=(runs||[]).filter(r=>r.jenis==='kerja'&&r.status!=='completed');
  const np=nextPM();
  const agent=k=>{
    const a=TIM[k];let on=null,st='';
    if(k==='pm'){on=pmRun;st=pmRun?'Sedang memilih tugas berikutnya…':'Siaga · bagi tugas tiap 30 mnt'}
    else if(k==='qa'){const q=T.filter(t=>t.qa);on=kerjaRun.length&&jalan.length?1:0;st=q.length?`${q.filter(t=>t.qa==='lolos').length} lolos · ${q.filter(t=>t.qa==='catatan').length} catatan`:'Belum ada pemeriksaan'}
    else{const w=T.find(t=>t.peran===k&&(t.status==='dikerjakan'||t.status==='antre'));on=w;st=w?'Sedang: '+esc(w.judul):`Siaga · ${T.filter(t=>t.peran===k&&t.status==='live').length} tugas live`}
    return `<div class="tile agent"><div class="row"><div class="av ${a.c}">${a.e}${on?'<i class="live"></i>':''}</div><div><h3>${a.n}</h3><div class="mut sm">${a.d}</div></div></div><div class="st ${on?'on':''}">${st}</div></div>`;
  };
  const ujiRun=(runs||[]).find(r=>r.jenis==='pengguna'&&r.status!=='completed');
  const uji=u=>{
    const m=[...(HQ.masukan||[])].reverse().find(x=>x.teks.includes('** '+u.n+'**')||x.teks.includes(' '+u.n+'**'));
    const pts=m?m.teks.split('\n').filter(l=>/^\s*-\s/.test(l)).map(l=>l.replace(/^\s*-\s*/,'')):[];
    const st=ujiRun?'Sedang mencoba Keepo…':m?'Masukan '+lalu(m.waktu):'Belum mencoba · tiap 07.00 WIB';
    return `<div class="tile agent"><div class="row"><div class="av ${u.c}">${u.e}${ujiRun?'<i class="live"></i>':''}</div><div><h3>${u.n}</h3><div class="mut sm">${u.d}</div></div></div><div class="st ${ujiRun?'on':''}">${st}</div>${pts.length?`<div class="sm"><b>${esc(pts[0])}</b></div>${pts.length>1?`<details class="more"><summary>+${pts.length-1} lagi</summary><ul class="pts sm2">${pts.slice(1).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></details>`:''}`:''}</div>`;
  };
  const evs=[];
  (runs||[]).filter(r=>r.hasil!=='skipped').slice(0,8).forEach(r=>evs.push({t:r.mulai,ic:r.jenis==='pm'?'🧭':r.jenis==='pengguna'?'👥':'🛠️',c:r.jenis==='pm'?'t-lav':r.jenis==='pengguna'?'t-pink':'t-lime',txt:`<b>${r.jenis==='pm'?'PM':r.jenis==='pengguna'?'Tester & pengguna AI':'Tim'}</b> ${r.status!=='completed'?'sedang bekerja':r.hasil==='success'?'selesai':r.hasil==='skipped'?'dilewati':'gagal'} · ${esc(r.judul)}`,url:r.url}));
  if(!runs)T.slice(0,8).forEach(t=>evs.push({t:t.diubah,ic:TIM[t.peran]?.e||'•',c:TIM[t.peran]?.c||'',txt:`<b>#${t.n}</b> ${esc(t.judul)} → ${ST[t.status]}`}));
  evs.sort((a,b)=>new Date(b.t)-new Date(a.t));
  V.innerHTML=`
  <div class="row" style="margin-bottom:16px"><div><div class="eyebrow mut">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Markas tim</h1></div><span class="sp"></span>
    <button class="btn ghost" id="pmnow" ${pmRun?'disabled':''}>${pmRun?'<i class="dot"></i> PM sedang bekerja…':IC.play+' Jalankan PM sekarang'}</button></div>
  <div class="bento">
    <div class="tile c t-lime span2"><div class="row" style="align-items:center;gap:16px"><div class="ring" style="--p:${p}"><b>${p}%</b></div><div style="min-width:0"><div class="eyebrow">Fase sekarang</div><h2 style="margin:4px 0 6px">${esc(R?.fase_sekarang||'—')}</h2><div class="sm">${esc(R?.prinsip||'')}</div></div></div></div>
    <div class="tile c ${siap.length?'t-sun':'t-mint'}" style="cursor:pointer" onclick="go('papan')"><div class="eyebrow">Menunggu kamu</div><div class="big">${siap.length}</div><div class="sm">${siap.length?'hasil siap dicek →':'Semua beres ✨'}</div></div>
    <div class="tile c t-pink"><div class="eyebrow">Sudah live</div><div class="big">${live}</div><div class="sm">${jalan.length} sedang dikerjakan</div></div>
  </div>

  <div class="sec"><h2>Tim agent</h2><span class="mut sm">Kerja terus · peran kosong langsung diberi tugas (cek tiap 30 mnt)</span></div>
  <div class="agents">${['pm','riset','desain','developer','marketing','qa'].map(agent).join('')}</div>

let HF='semua',LAMA=false;
async function hasilKerja(again){
  if(!again)skel();
  let L;try{L=await call('/hasil')}catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>';return}
  if(cur!=='hasil')return;
  if(!HQ){try{await load()}catch(e){}}
  const OK={menuju:['🚀 Menuju live','t-blue'],live:['✅ Live','t-mint'],siap:['⏳ Menunggu kamu','t-sun'],dikerjakan:['🛠️ Dikerjakan','t-lav'],antre:['🕒 Antre','t-lav'],ditolak:['✖ Ditolak',''],gagal:['⚠️ Gagal','']};
  const item=L.filter(t=>t.status!=='gagal'||t.laporan).map(t=>({...t,h:t.laporan?hasil([{dari:'agent',teks:t.laporan.teks,waktu:t.laporan.waktu}]):null,w:t.laporan?t.laporan.waktu:t.diubah}));
  const mas=(HQ&&HQ.masukan||[]).map(m=>{const nm=(m.teks.match(/\*\*\S+\s+([^*]+)\*\*/)||[])[1]||'Tester';return{masukan:1,nama:nm.trim(),w:m.waktu,poin:m.teks.split('\n').filter(l=>/^\s*-\s/.test(l)).map(l=>l.replace(/^\s*-\s*/,''))}});
  const per=['riset','desain','developer','marketing','pm'];
  const cnt=k=>item.filter(t=>t.peran===k&&(t.status==='live'||t.status==='siap')).length;
  const lv=item.filter(t=>t.status==='live').length, sp=item.filter(t=>t.status==='siap').length;
  let all=[...item,...mas];
  if(HF==='penguji')all=mas;else if(HF!=='semua')all=item.filter(t=>t.peran===HF);
  all.sort((x,y)=>new Date(y.w)-new Date(x.w));
  const batas=Date.now()-7*864e5, nLama=all.filter(x=>new Date(x.w)<batas).length;
  if(!LAMA)all=all.filter(x=>new Date(x.w)>=batas);
  const hari=d=>new Date(d).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
  const grp=[];all.forEach(x=>{const h=hari(x.w);let g=grp.find(g=>g.h===h);if(!g)grp.push(g={h,xs:[]});g.xs.push(x)});
  const kartu=x=>{
    if(x.masukan){const u=UJI.find(u=>u.n===x.nama)||{e:'👥',c:'t-pink',d:'Tester'};
      return `<div class="tile hk"><div class="row"><span class="chip">${u.e} ${esc(x.nama)}</span><span class="mut sm">${esc(u.d)}</span></div><b style="display:block;margin:8px 0 4px">Masukan untuk tim</b><ul class="pts sm2">${x.poin.slice(0,3).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;}
    const [lb,c]=OK[x.status]||[x.status,''];
    const pts=x.h?x.h.poin.slice(0,3):[];
    return `<div class="tile hk" style="cursor:pointer" onclick="detail(${x.n})"><div class="row">${chipP(x.peran)}<span class="chip ${c}">${lb}</span>${x.qa?chipQ(x.qa):''}<span class="sp"></span><span class="mut sm">#${x.n}</span></div><b style="display:block;margin:8px 0 4px">${esc(x.judul)}</b>${pts.length?`<ul class="pts sm2">${pts.map(p=>`<li>${inl(p)}</li>`).join('')}</ul>`:'<div class="mut sm">Belum ada laporan.</div>'}</div>`;
  };
  const f=(k,l)=>`<button class="chip ${HF===k?'on':''}" onclick="HF='${k}';hasilKerja(true)">${l}</button>`;
  V.innerHTML=`
  <div style="margin-bottom:16px"><div class="eyebrow mut">Semua yang sudah dikerjakan tim</div><h1>Hasil kerja</h1></div>
  <div class="bento">
    <div class="tile c t-mint"><div class="eyebrow">Sudah live</div><div class="big">${lv}</div><div class="sm">hasil dipakai</div></div>
    <div class="tile c t-sun" style="cursor:pointer" onclick="go('papan')"><div class="eyebrow">Menunggu kamu</div><div class="big">${sp}</div><div class="sm">cek & setujui →</div></div>
    <div class="tile c t-pink"><div class="eyebrow">Masukan tester</div><div class="big">${mas.length}</div><div class="sm">${[...new Set(mas.map(m=>m.nama))].join(', ')||'belum ada'}</div></div>
  </div>
  <div class="sec"><h2>Per anggota tim</h2></div>
  <div class="agents">${per.map(k=>`<div class="tile agent" style="cursor:pointer" onclick="HF='${k}';hasilKerja(true)"><div class="row"><div class="av ${TIM[k].c}">${TIM[k].e}</div><div><h3>${TIM[k].n}</h3><div class="mut sm">${TIM[k].d}</div></div></div><div class="st"><b>${cnt(k)}</b> hasil</div></div>`).join('')}</div>
  <div class="row hf" style="margin:18px 0 6px;flex-wrap:wrap;gap:8px">${f('semua','Semua')}${per.map(k=>f(k,TIM[k].e+' '+TIM[k].n)).join('')}${f('penguji','👥 Tester & pengguna')}</div>
  ${grp.length?grp.map(g=>`<div class="sec"><h2 style="font-size:20px">${esc(g.h)}</h2></div><div class="grid">${g.xs.map(kartu).join('')}</div>`).join(''):'<div class="empty">Belum ada hasil 7 hari terakhir.</div>'}${nLama?`<div style="margin:14px 0"><button class="btn ghost more-btn" style="width:100%" onclick="LAMA=!LAMA;hasilKerja(true)">${LAMA?'Lipat yang lama':'Tampilkan lebih lama ('+nLama+')'}</button></div>`:''}`;
  clearTimeout(timer);timer=setTimeout(()=>{if(cur==='hasil')hasilKerja(true)},30000);
}

let LIVEALL=false;
async function papan(again){
  if(!again){if(!HQ)skel();try{await load()}catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>';return}}
  if(cur!=='papan')return;
  const cols=[['antre','Antre','t-blue'],['dikerjakan','Dikerjakan','t-sun'],['siap','Siap dicek','t-lime'],['menuju','Menuju live','t-blue'],['live','Live','t-mint'],['gagal','Gagal / ditolak','t-coral']];
  const by=k=>HQ.tasks.filter(t=>k==='gagal'?(t.status==='gagal'||t.status==='ditolak'):t.status===k);
  const kartuP=t=>`<div class="card" onclick="detail(${t.n})"><div class="row">${chipP(t.peran)}${t.otomatis?'<span class="chip o">🤖 otomatis</span>':''}${chipQ(t.qa)}</div><b>${esc(t.judul)}</b><span class="mut sm">#${t.n} · ${lalu(t.diubah)}</span></div>`;
  V.innerHTML=`<div class="row" style="margin-bottom:16px"><h1>Papan tugas</h1><span class="sp"></span><button class="btn lime" onclick="perintah()">＋ Perintah</button></div>
  <div class="board">${cols.map(([k,l,c])=>{const L=by(k);const lipat=k==='live'&&L.length>5&&!LIVEALL;return `<div class="col k-${k}"><h3><span>${l}</span><span class="chip ${c}">${L.length}</span></h3>${L.length?(lipat?[...L].sort((a,b)=>new Date(b.diubah)-new Date(a.diubah)).slice(0,5):L).map(kartuP).join(''):'<div class="empty sm">Kosong</div>'}${k==='live'&&L.length>5?`<button class="btn ghost more-btn" onclick="LIVEALL=!LIVEALL;papan(true)">${LIVEALL?'Lipat':'Lihat semua ('+L.length+')'}</button>`:''}</div>`}).join('')}</div>`;
  auto(papan);
}

async function dokumen(path,ref,back){
  if(!HQ){skel();try{await load()}catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>';return}}
  if(path){
    V.innerHTML='<div class="skel"></div>';
    try{const d=await call('/doc?path='+encodeURIComponent(path)+(ref?'&ref='+encodeURIComponent(ref):''));
      const html=window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(d.isi)):'<pre>'+esc(d.isi)+'</pre>';
      V.innerHTML=`<button class="back" id="bk">← ${back?'Kembali ke tugas':'Semua dokumen'}</button>${ref?'<div class="note">📝 Draf — belum disetujui</div>':''}<article class="tile read">${html}</article>`;
      $('#bk').onclick=()=>back?detail(back):go('dokumen');
      // ADHD: tiap bagian h2 bisa dilipat, bagian pertama terbuka
      const art=V.querySelector('article');const hs=[...art.querySelectorAll('h2')];
      if(hs.length>2)hs.forEach((h,i)=>{const det=document.createElement('details');if(i===0)det.open=true;const sum=document.createElement('summary');sum.innerHTML=h.innerHTML;det.appendChild(sum);let x=h.nextSibling;while(x&&!(x.nodeType===1&&x.tagName==='H2')){const nx=x.nextSibling;det.appendChild(x);x=nx}h.replaceWith(det)});
    }catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>'}
    return;
  }
  const col=n=>n.includes('riset')?'t-blue':n.includes('desain')?'t-pink':n.includes('TIM')?'t-lav':'t-sun';
  V.innerHTML=`<div style="margin-bottom:16px"><div class="eyebrow mut">Hasil kerja riset, desain, dan PM</div><h1>Dokumen</h1></div>
  ${HQ.docs.length?`<div class="doclist">${HQ.docs.map(p=>{const n=p.replace('docs/','').replace('.md','');return `<div class="tile c ${col(n)}" style="cursor:pointer" onclick="go('dokumen','${esc(p)}')"><div style="font-size:26px">📄</div><h3 style="margin-top:8px;overflow-wrap:anywhere">${esc(n.replace(/[-_]/g,' '))}</h3></div>`}).join('')}</div>`:'<div class="empty">Belum ada dokumen. Agent Riset/Desain akan menulis di sini.</div>'}`;
}

// Ambil hasil kerja terakhir dari komentar agent jadi bagian-bagian pendek
function hasil(riwayat){
  const m=[...riwayat].reverse().find(x=>x.dari==='agent'&&/Siap dicek|tidak mengubah/i.test(x.teks));
  if(!m)return null;
  const [ring,qa='']=m.teks.replace(/^\*\*[^*]+\*\*\s*/,'').split(/\n-{3,}\n/);
  const bul=s=>s.split('\n').filter(l=>/^\s*[-*•]\s+/.test(l)).map(l=>l.replace(/^\s*[-*•]\s+/,'').trim());
  let poin=bul(ring);if(!poin.length)poin=ring.split('\n').map(x=>x.replace(/^#+\s*/,'').trim()).filter(x=>x&&!/^ringkasan/i.test(x));
  const isTugas=x=>/^(\*\*)?(langkah (anda|kamu)|tugas kamu|yang perlu kamu|cara cek)/i.test(x);
  const qaL=qa.split('\n').map(x=>x.trim()).filter(Boolean);
  return {poin:poin.filter(x=>!isTugas(x)),tugas:poin.filter(isTugas).map(x=>x.replace(/^(\*\*)?(langkah (anda|kamu)|tugas kamu|yang perlu kamu)\s*:?\s*(\*\*)?\s*:?\s*/i,'')),
    qaOk:/lolos/i.test(qaL[0]||''),qaAda:!!qaL.length,qa:bul(qa),waktu:m.waktu};
}
const inl=s=>window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parseInline(String(s))):esc(s);

async function detail(n){
  clearTimeout(timer);scrollTo(0,0);
  let t;try{t=await call('/tasks/'+n)}catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>';return}
  const hq=(HQ?.tasks||[]).find(x=>x.n===n)||{};
  const peran=hq.peran||'developer', kerja=t.status==='antre'||t.status==='dikerjakan'||t.status==='menuju';
  const h=hasil(t.riwayat);
  const ref=t.pr&&!t.pr.merged?t.branch:'';
  const docs=(t.files||[]).filter(f=>/^docs\/[\w.-]+\.md$/.test(f));
  const kodeBerubah=(t.files||[]).some(f=>!f.startsWith('docs/'));
  const LIM=4;
  const warna={menuju:'t-blue',siap:'t-lime',live:'t-mint',gagal:'t-coral',ditolak:'',antre:'t-blue',dikerjakan:'t-sun'}[t.status]||'';
  const pesan={menuju:'Disetujui ✅ Masuk antrean live, otomatis tayang ±2–10 menit.',siap:'Hasilnya siap. Cek, lalu putuskan.',live:'Sudah live 🎉',gagal:'Agent gagal. Coba kirim revisi.',ditolak:'Ditolak.',antre:'Menunggu giliran…',dikerjakan:'Tim sedang bekerja…'}[t.status];
  V.innerHTML=`<button class="back" onclick="go(cur)">← Kembali</button>
  <div class="dt">
  <section class="tile c ${warna} hero">
    <div class="row">${chipP(peran)}${hq.otomatis?'<span class="chip o">🤖 otomatis</span>':''}<span class="sp"></span><span class="sm">#${t.n}</span></div>
    <h2 class="ttl">${esc(t.judul)}</h2>
    <div class="say">${t.status==='dikerjakan'?'<i class="dot" style="display:inline-block"></i> ':''}${pesan}</div>
    ${t.status==='siap'?`<div class="acts"><button class="btn big-b" id="ok">✓ Setujui</button><button class="btn ghost big-b" id="rvb">✎ Revisi</button><button class="btn ghost big-b" id="no">✕ Tolak</button></div>`:''}
    ${kerja?`<div class="acts"><a class="btn ghost" target="_blank" href="${t.actions}">Lihat log</a></div>`:''}
    ${t.status==='live'?`<div class="acts"><a class="btn" target="_blank" href="https://rzk-labs.github.io/baca-bahasa/">Buka Keepo ↗</a></div>`:''}
    <div id="e" class="err"></div>
  </section>
  <div id="rvbox" class="tile" style="display:${t.status==='gagal'||t.status==='live'?'block':'none'}"><h3>${t.status==='live'?'Ubah lagi':'Revisi'}</h3><p class="mut">Satu kalimat cukup. Tim lanjut dari hasil terakhir.</p><textarea id="rv" placeholder="Contoh: pertanyaannya kebanyakan, jadikan 10 saja."></textarea><div class="row" style="margin-top:10px"><button class="btn" id="kr">Kirim revisi</button></div></div>
  ${h&&!kerja?`
  <section class="tile">
    <div class="lbl">✨ Hasilnya</div>
    <ul class="pts">${h.poin.slice(0,LIM).map(x=>`<li>${inl(x)}</li>`).join('')}</ul>
    ${h.poin.length>LIM?`<details class="more"><summary>+${h.poin.length-LIM} poin lagi</summary><ul class="pts">${h.poin.slice(LIM).map(x=>`<li>${inl(x)}</li>`).join('')}</ul></details>`:''}
    ${docs.length||(t.preview&&kodeBerubah)?`<div class="acts">${docs.map(d=>`<button class="btn lime" data-doc="${esc(d)}">📄 Baca ${esc(d.replace('docs/','').replace('.md','').replace(/[-_]/g,' '))}</button>`).join('')}${t.preview&&kodeBerubah&&!t.pr?.merged?`<a class="btn lime" target="_blank" href="${t.preview}">📱 Coba di app</a>`:''}</div>`:''}
  </section>
  ${h.tugas.length?`<section class="tile c t-sun"><div class="lbl">👉 Tugas kamu</div><ul class="pts">${h.tugas.map(x=>`<li>${inl(x)}</li>`).join('')}</ul></section>`:''}
  ${h.qaAda?`<details class="tile qa"><summary><span class="chip ${h.qaOk?'s-live':'s-dikerjakan'}">${h.qaOk?'✅ QA lolos':'⚠️ QA ada catatan'}</span><span class="mut sm">lihat catatan</span></summary><ul class="pts sm2">${h.qa.map(x=>`<li>${inl(x)}</li>`).join('')}</ul></details>`:''}`:''}
  <details class="tile more"><summary>Detail lengkap (perintah &amp; riwayat)</summary>
    <div class="msg ${hq.otomatis?'':'kamu'}"><small>${hq.otomatis?'PM agent':'Kamu'} · ${tgl(t.dibuat)}</small><div class="md">${md(t.isi)}</div></div>
    ${t.riwayat.map(m=>`<div class="msg ${m.dari}"><small>${m.dari==='kamu'?'Kamu':'Tim agent'} · ${tgl(m.waktu)}</small><div class="md">${md(m.teks)}</div></div>`).join('')}
    <a class="mut sm" href="${t.url}" target="_blank">Buka di GitHub ↗</a>
  </details>
  </div>`;
  V.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{clearTimeout(timer);dokumen(b.dataset.doc,ref,n)});
  const act=async(a,b,el)=>{el.disabled=true;$('#e').textContent='';try{await call('/tasks/'+n+'/'+a,b||{});HQ=null;await load();detail(n)}catch(e){$('#e').textContent=e.message;el.disabled=false}};
  if($('#ok'))$('#ok').onclick=e=>act('setujui',0,e.currentTarget);
  if($('#no'))$('#no').onclick=e=>{const b=e.currentTarget;if(b.dataset.y)act('tolak',0,b);else{b.dataset.y=1;b.textContent='Yakin tolak?'}};
  if($('#rvb'))$('#rvb').onclick=()=>{$('#rvbox').style.display='block';$('#rv').focus()};
  if($('#kr'))$('#kr').onclick=e=>act('revisi',{isi:$('#rv').value},e.currentTarget);
  if(kerja)timer=setTimeout(()=>detail(n),12000);
}
function md(s){return window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(String(s||''))):esc(s).replace(/\n/g,'<br>')}

function perintah(){
  const v=$('#veil');v.classList.add('on');
  $('#sheet').innerHTML=`<div class="row"><h2>Perintah ke tim</h2><span class="sp"></span><button class="btn ghost" onclick="tutup()">✕</button></div>
  <p class="mut sm">Pilih siapa yang mengerjakan, lalu jelaskan seperti ngobrol.</p>
  <div class="roles">${['developer','desain','riset','marketing','pm'].map((k,i)=>`<label><input type="radio" name="peran" value="${k}" ${i?'':'checked'}><span><i>${TIM[k].e}</i>${TIM[k].n}</span></label>`).join('')}</div>
  <textarea id="isi" placeholder="Contoh: di tab Kata, tambahin tombol acak urutan kartu."></textarea>
  <div class="row" style="margin-top:12px"><button class="btn lime" id="kirim">Kirim ke tim</button><span id="e2" class="err"></span></div>`;
  $('#isi').focus();
  $('#kirim').onclick=async e=>{const b=e.currentTarget;b.disabled=true;
    try{const t=await call('/tasks',{isi:$('#isi').value,peran:document.querySelector('input[name=peran]:checked').value});tutup();await load();detail(t.n)}catch(x){$('#e2').textContent=x.message;b.disabled=false}};
}
function tutup(){$('#veil').classList.remove('on')}
$('#veil').onclick=e=>{if(e.target.id==='veil')tutup()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')tutup()});

if(!tok){navs();login()}else{const h=location.hash.slice(1)||'markas',i=h.indexOf('/'),k=i<0?h:h.slice(0,i),a=i<0?'':h.slice(i+1);go(NAV.some(x=>x[0]===k)?k:'markas',a&&decodeURIComponent(a))}
</script></body></html>

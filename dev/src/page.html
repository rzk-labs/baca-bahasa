<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keepo HQ</title>
<meta name="theme-color" content="#351E28">
<link rel="icon" href="https://rzk-labs.github.io/baca-bahasa/icon-192.png">
<link rel="apple-touch-icon" href="https://rzk-labs.github.io/baca-bahasa/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#F1ECE2;--ink:#351E28;--mut:#6B5E66;--card:#FAF7F0;--line:#D8CFC2;--soft:#E9F3FA;
  --wasabi:#E9F056;--jade:#AEB8A0;--paper:#FAF7F0;--plum:#351E28;
  --on:#351E28;--shadow:none;--fs:15px;--pad:18px;--gap:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#351E28;--ink:#FAF7F0;--mut:#C4B8BF;--card:#42283A;--line:#5A4150;--soft:#4A3040}}
:root[data-theme="dark"]{--bg:#351E28;--ink:#FAF7F0;--mut:#C4B8BF;--card:#42283A;--line:#5A4150;--soft:#4A3040}
/* pengaturan baca */
:root[data-kontras="tinggi"]{--mut:#4a3c46;--line:#9C8F80}
:root[data-kontras="tinggi"][data-theme="dark"]{--mut:#E6DDE2;--line:#8A6F7E}
@media (prefers-color-scheme:dark){:root[data-kontras="tinggi"]:not([data-theme="light"]){--mut:#E6DDE2;--line:#8A6F7E}}
:root[data-kontras="tinggi"] .tile,:root[data-kontras="tinggi"] .card,:root[data-kontras="tinggi"] .stage{border-width:3px}
:root[data-rapat="1"]{--pad:12px;--gap:9px}
:root[data-judul="biasa"] h1,:root[data-judul="biasa"] h2,:root[data-judul="biasa"] h3,:root[data-judul="biasa"] .disp,:root[data-judul="biasa"] .lbl,:root[data-judul="biasa"] .read details>summary,:root[data-judul="biasa"] .brand b{text-transform:none;line-height:1.1;letter-spacing:0}
:root[data-gerak="kurang"] *,:root[data-gerak="kurang"] *::before,:root[data-gerak="kurang"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.05;margin:0}
h1{font-size:calc(var(--fs)*2.93)}h2{font-size:calc(var(--fs)*1.73)}h3{font-size:calc(var(--fs)*1.27)}
h1,h2,h3{overflow-wrap:anywhere}
a{color:inherit}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
/* sidebar */
.side{display:none}
.main{padding:16px 16px 110px;max-width:1180px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:24px;line-height:1.1;background:linear-gradient(transparent 62%,var(--wasabi) 62% 92%,transparent 92%);padding:0 4px}
.brand small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;background:#351E28;padding:6px;border-radius:999px;box-shadow:0 6px 18px rgba(53,30,40,.2)}
.tabbar button{border:0;background:none;color:#FAF7F0;opacity:.75;padding:9px 11px;border-radius:999px;font-weight:700;font-size:calc(var(--fs)*.87);cursor:pointer;display:flex;align-items:center;gap:6px}
.tabbar button.on{background:#FAF7F0;color:#351E28;opacity:1}
.tabbar svg{width:18px;height:18px}
@media (min-width:1000px){
  .app{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:2px solid var(--line)}
  .side .brand{margin-bottom:18px}
  .side nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:11px 14px;border-radius:14px;font-weight:700;cursor:pointer;text-align:left}
  .side nav button.on{background:var(--ink);color:var(--bg)}
  .side nav svg{width:19px;height:19px}
  .side .foot{margin-top:auto;font-size:12px;color:var(--mut)}
  .tabbar,.top .brand{display:none}
  .main{padding:28px 32px 48px}
}
.tabbar{max-width:calc(100vw - 16px)}
@media (max-width:480px){.tabbar button span{display:none}.tabbar button.on span{display:inline}.tabbar button{padding:10px 12px}}
/* blocks */
.grid{display:grid;gap:14px}
.bento{display:grid;gap:var(--gap);grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:1.5px solid var(--ink);border-radius:20px;padding:var(--pad);background:var(--card);position:relative;overflow:hidden;min-width:0}
.tile.c{color:var(--on)}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.t-lime,.t-lav,.t-pink,.t-mint{background:var(--jade);color:#351E28}.t-blue{background:#D7EFFF;color:#351E28}.t-sun{background:var(--wasabi);color:#351E28}.t-coral{background:var(--paper);color:#351E28;border-style:dashed}.t-ink{background:#351E28;color:#FAF7F0}
.eyebrow{font-size:calc(var(--fs)*.8);font-weight:800;letter-spacing:.02em;opacity:.75}
.big{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:56px;line-height:.9}
.mut{color:var(--mut)}.sm{font-size:calc(var(--fs)*.87)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:800;font-size:calc(var(--fs)*.93);padding:10px 16px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.lime{background:var(--wasabi);color:#351E28;border-color:#351E28}
.tile.c .btn{border-color:#351E28;background:#351E28;color:#FAF7F0}.tile.c .btn.ghost{background:transparent;color:#351E28}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.sec{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:28px 0 12px}
/* ring */
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(#351E28 calc(var(--p)*1%),rgba(53,30,40,.15) 0);display:grid;place-items:center;flex:none}
.ring b{width:68px;height:68px;border-radius:50%;background:var(--wasabi);color:#351E28;display:grid;place-items:center;font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:24px}
/* agents */
.agents{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.agent{display:flex;flex-direction:column;gap:10px}
.av{width:52px;height:52px;border-radius:16px;border:1.5px solid #351E28;color:#351E28;display:grid;place-items:center;font-size:26px;flex:none;position:relative}
.av .live{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--wasabi);border:2px solid #351E28;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.7)}}
.agent .st{font-size:calc(var(--fs)*.87);font-weight:700;padding:8px 10px;border-radius:12px;background:var(--soft);min-height:38px}
.agent .st.on{background:var(--wasabi);color:#351E28}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:calc(var(--fs)*.8);font-weight:800;padding:3px 9px;border-radius:999px;border:1.5px solid #351E28;color:#351E28;white-space:nowrap;line-height:1.4}
.s-antre,.s-menuju{background:#D7EFFF}.s-dikerjakan{background:var(--wasabi)}.s-siap{background:var(--wasabi)}.s-gagal,.s-ditolak{background:var(--paper);border-style:dashed;border-width:2px}.s-live{background:var(--jade)}
.pil{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;margin:-6px 0 -6px -8px;cursor:pointer}.pil input{width:26px;height:26px;margin:0;accent-color:#351E28;cursor:pointer}
.mbar{margin:0 0 10px}.mbar .mt,.mbar .ma{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.mbar .btn{flex:1 1 auto}.mbar .ma{padding:10px;border:1.5px solid #351E28;border-radius:18px;background:var(--wasabi);color:#351E28;align-items:center}.mbar .ma b{flex:1 1 100%}.mbar .lap-m{flex:1 1 100%;font-size:14px;line-height:1.4;overflow-wrap:anywhere}.mbar .lap-m ul{margin:4px 0 0;padding-left:18px}
.tk{min-width:0;overflow-wrap:anywhere}.tk .lap{margin:6px 0 0}.tk .row{gap:6px}.grid>.tk{margin-bottom:0}
.p-developer,.p-riset,.p-desain,.p-pm,.p-qa,.p-marketing{background:var(--jade)}
.chip.o{background:transparent;color:var(--ink);border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.col{background:var(--soft);border-radius:22px;padding:12px;scroll-snap-align:start}
@media (min-width:760px){.col{min-height:200px}}
@media (max-width:759px){.col.kosong{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px}.col.kosong h3{margin:0}.col.kosong .empty{padding:0;margin:0;border:0;background:none}}
.col.k-live .more-btn{width:100%;margin:2px 0 4px}
@media (max-width:759px){.col.k-siap{order:0}.col.k-dikerjakan{order:1}.col.k-antre{order:2}.col.k-menuju{order:3}.col.k-live{order:4}.col.k-gagal{order:5}.col.k-gagal.ada{order:-1}}
.col h3{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 12px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0 4px;line-height:1.3;overflow-wrap:anywhere}
.ic-s{width:13px;height:13px;flex:none;vertical-align:-2px}.btn .ic-s{width:15px;height:15px}
.qa-d{display:block;width:100%}.qa-d>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;min-height:36px;box-sizing:border-box;border-radius:999px;border:1.5px solid var(--ink);background:var(--soft);color:var(--ink);line-height:1.4}.qa-d>summary::-webkit-details-marker{display:none}.qa-d>summary::before{display:none}.qa-d .qa-t{margin:6px 2px 0;font-size:13px;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.chip.belum{background:transparent;color:var(--ink);border-style:dashed}
/* timeline */
.feed{display:grid;gap:0}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1.5px dashed var(--line);align-items:flex-start}
.ev:last-child{border:0}
.ev .ic{width:34px;height:34px;border-radius:11px;border:1.5px solid #351E28;color:#351E28;display:grid;place-items:center;flex:none;font-size:16px}
.ev b{font-weight:700}
/* map */
.phase{margin-bottom:12px}
.phase>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 2px}
.phase>summary::before{display:none}
.phase>summary h3{margin:0;overflow-wrap:anywhere}
.phase>summary .bar{grid-column:1/-1;height:6px}
.stages{display:grid;gap:8px;margin-top:8px;align-items:stretch;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.stages{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stage{border:2px solid var(--ink);border-radius:16px;background:var(--card);min-width:0}
.stage>summary{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 10px;align-items:start;padding:10px 12px;min-height:92px;box-sizing:border-box;font-weight:400}
.stage>summary::before{display:none}
.stage .no{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:22px;line-height:1.1;grid-row:1/4}
.stage b{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;overflow-wrap:anywhere}
.stage .chip{justify-self:start}
.stage .ct{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.stage .dt2{padding:0 12px 12px;overflow-wrap:anywhere}
.stage[open]>summary b,.stage[open]>summary .ct{display:block}
.stage .dt2 .acts{margin-top:10px;flex-wrap:wrap}
.stage .dt2 .btn{max-width:100%;white-space:normal;text-align:left}
.bk4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:640px){.bk4{grid-template-columns:repeat(2,minmax(0,1fr))}}.bk4 .eyebrow{white-space:normal}.bkj{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.evl{padding:16px}.evl .big{font-size:30px}.evs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.evs .eyebrow{white-space:normal;font-size:11px}.evbar{display:flex;height:12px;border-radius:999px;overflow:hidden;border:1.5px solid var(--ink);margin-top:6px}.evbar i{display:block;height:100%}.k-selesai{background:var(--jade)}.k-draft,.k-berjalan{background:var(--wasabi)}.k-awal{background:#D7EFFF}.k-belum{background:transparent;color:var(--ink);border-style:dashed}
.bar{height:10px;border-radius:99px;background:rgba(53,30,40,.15);overflow:hidden}.bar i{display:block;height:100%;background:var(--wasabi);box-shadow:inset 0 0 0 1px #351E28;border-radius:99px}
/* doc */
.doclist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.md{max-width:75ch;line-height:1.65;overflow-wrap:anywhere}.md h1,.md h2,.md h3{margin:22px 0 10px}.md h1{font-size:32px}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}.md td,.md th{border:1.5px solid var(--line);padding:6px 10px;text-align:left}
.md code{background:var(--soft);padding:1px 5px;border-radius:6px}.md pre{background:var(--soft);padding:12px;border-radius:12px;overflow-x:auto}
/* detail */
.msg{border-left:4px solid var(--jade);padding:4px 0 4px 14px;margin:14px 0}
.msg.kamu{border-color:var(--wasabi)}.msg small{display:block;color:var(--mut);font-weight:800;margin-bottom:2px}
textarea,input,select{width:100%;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;outline:none}
textarea{min-height:120px;resize:vertical}
.gb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.gb .th{position:relative;width:64px;height:64px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--soft);flex:none}.gb .th img{width:100%;height:100%;object-fit:cover;display:block}.gb .th button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);background:var(--wasabi);color:#351E28;font-weight:800;line-height:1;cursor:pointer;padding:0}.gb .hint{flex-basis:100%;font-size:12px;color:var(--mut)}
.kth{display:flex;gap:6px;margin-top:8px}.kth img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1.5px solid var(--ink)}
.md img{max-width:100%;height:auto;border-radius:12px;border:1.5px solid var(--ink)}
textarea:focus,input:focus,select:focus{box-shadow:0 0 0 3px var(--wasabi),0 0 0 4.5px #351E28}
.err{color:var(--ink);border-left:3px solid var(--ink);padding-left:8px;font-weight:700;font-size:14px}
.back{border:0;background:none;font-weight:800;cursor:pointer;padding:6px 0;margin-bottom:8px}
/* panel pengaturan */
.set-g{margin:16px 0}.set-g>b{display:block;font-weight:800;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.set-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.prev{border:2px dashed var(--line);border-radius:16px;padding:14px;margin:12px 0;background:var(--card)}
.prev h3{margin-bottom:6px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(53,30,40,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px max(20px,env(safe-area-inset-bottom));border:2px solid var(--ink);border-bottom:0;max-height:92vh;overflow:auto}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:20px;border-bottom:2px solid var(--ink)}}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.roles label{cursor:pointer}
.roles input{display:none}
.roles span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:2px solid var(--ink);border-radius:16px;font-weight:800;font-size:12px;text-align:center}
.roles span i{font-style:normal;font-size:22px}
.roles input:checked+span{background:var(--wasabi);color:#351E28;border-color:#351E28}
.empty{padding:22px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:18px}
.skel{height:120px;border-radius:24px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.fab{position:fixed;right:16px;bottom:88px;z-index:21}
@media (min-width:1000px){.fab{display:none}}

/* ADHD-friendly detail & dokumen */
.dt{display:grid;gap:14px;max-width:760px}
.dt .tile{padding:20px}
.hero .ttl{font-size:calc(var(--fs)*2);margin:12px 0 6px;line-height:1}
.say{font-size:calc(var(--fs)*1.2);font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.mock{display:flex;flex-direction:column;align-items:center;gap:10px}.hp{width:min(100%,300px);border:3px solid var(--ink);border-radius:34px;padding:10px;background:#111;box-shadow:0 6px 0 var(--ink)}.hp iframe{display:block;width:100%;height:520px;border:0;border-radius:24px;background:#fff}.hp .poni{width:70px;height:6px;border-radius:9px;background:#333;margin:0 auto 8px}
.big-b{padding:13px 20px;font-size:16px}
.lbl{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:20px;margin-bottom:8px}
.pts{margin:0;padding-left:22px;font-size:calc(var(--fs)*1.13);line-height:1.6}
.pts li{margin:8px 0;padding-left:4px}
.pts.sm2{font-size:15px;margin-top:10px}
details>summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸';transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details.more>summary{color:var(--mut);margin-top:8px}
.note{display:inline-block;background:var(--wasabi);color:#351E28;font-weight:800;padding:6px 12px;border-radius:12px;margin-bottom:12px}
.read{max-width:720px;font-size:calc(var(--fs)*1.13);line-height:1.75;padding:24px}
.read h1{font-size:calc(var(--fs)*2.2);margin:0 0 14px}
.read h3{margin:18px 0 6px;font-size:20px}
.read p{margin:10px 0}
.read li{margin:6px 0}
.read .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0;max-width:100%}
.read table{border-collapse:collapse;font-size:var(--fs);line-height:1.5;min-width:100%}
.read th,.read td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.read th{background:var(--soft);font-weight:700;white-space:nowrap}
.read tbody tr:nth-child(even){background:var(--soft)}
.dsum{margin:4px 0 8px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.dcard[hidden]{display:none}

async function setujuiMassal(){
  if(MASSAL&&MASSAL.jalan)return;

async function call(path,body,coba=0){
  let r;try{r=await fetch('/api'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:body?JSON.stringify(body):undefined})}catch(e){r=null}
  if((!r||r.status>=500)&&!body&&coba<2){await new Promise(z=>setTimeout(z,1500));return call(path,body,coba+1)}
  if(!r)throw new Error('Koneksi putus. Coba muat ulang.');
  const d=await r.json().catch(()=>({}));
  if(r.status>=500)throw new Error(d.error||'Server sedang sibuk. Muat ulang sebentar lagi.');
  if(r.status===401&&path!=='/login'){tok='';login();throw new Error('Perlu login')}
  if(!r.ok)throw new Error(d.error||'Gagal ('+r.status+')');
  return d;
}

function nextPM(){const d=new Date();d.setUTCHours(1,0,0,0);if(d<=new Date())d.setUTCDate(d.getUTCDate()+1);return d}
function progres(r){if(!r)return 0;return Math.round(r.tahap.reduce((a,t)=>a+(BOBOT[t.status]||0),0)/r.tahap.length*100)}

// Kuota harian per peran: samakan dengan .github/workflows/kepo-jaga.yml (developer 100, desain 8, riset 6, pm 6, marketing 4).
const KUOTAP={developer:100,desain:8,riset:6,pm:6,marketing:4},KUOTA=Object.values(KUOTAP).reduce((a,b)=>a+b,0);

function kuotaPerforma(T){
  const selesai=t=>['siap','menuju','live'].includes(t.status), gagal=t=>t.status==='gagal'||t.status==='ditolak';
  const hari=T.filter(t=>selesai(t)&&hariIni(t.diubah)), mulai=T.filter(t=>hariIni(t.dibuat));
  const n=hari.length, pct=Math.min(100,Math.round(n/KUOTA*100)), sisa=Math.max(0,KUOTA-n);
  const baris=['developer','riset','desain','pm','marketing'].map(k=>{
    const a=T.filter(t=>t.peran===k), ok=a.filter(selesai).length, gg=a.filter(gagal).length, kerja=a.filter(t=>t.status==='dikerjakan'||t.status==='antre').length;
    const qa=a.filter(t=>t.qa), lolos=qa.filter(t=>t.qa==='lolos').length, hs=hari.filter(t=>t.peran===k).length;
    const rate=ok+gg?Math.round(ok/(ok+gg)*100):0;
    return `<div class="ev"><div class="ic ${TIM[k].c}">${TIM[k].e}</div><div style="min-width:0;flex:1"><div><b>${TIM[k].n}</b> · ${hs}/${KUOTAP[k]} hari ini</div><div class="mut sm">${ok} selesai · ${kerja} jalan · ${gg} gagal · ${rate}% berhasil${qa.length?` · QA lolos ${lolos}/${qa.length}`:''}</div></div></div>`}).join('');
  return `<div class="sec"><h2>Kuota & performa</h2><span class="mut sm">Hari ini (WIB) · target ${KUOTA} tugas/hari (developer ${KUOTAP.developer})</span></div>

  <div class="tile c t-pink"><div class="eyebrow">Gagal total</div><div class="big">${T.filter(gagal).length}</div><div class="sm">perlu dicek</div></div></div>
  <div class="tile" style="margin-top:12px"><div class="feed">${baris}</div></div>`;
}
async function markas(again){
  if(!again){if(!HQ)skel();try{await load()}catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>';return}}
  if(cur!=='markas')return;

  const siap=T.filter(t=>t.status==='siap'), jalan=T.filter(t=>t.status==='dikerjakan'||t.status==='antre');
  const live=T.filter(t=>t.status==='live').length, p=progres(R);
  const pmRun=(runs||[]).find(r=>r.jenis==='pm'&&r.status!=='completed');
  const kerjaRun=(runs||[]).filter(r=>r.jenis==='kerja'&&r.status!=='completed');
  const np=nextPM();
  const agent=k=>{
    const a=TIM[k];let on=null,st='';
    if(k==='pm'){on=pmRun;st=pmRun?'Sedang memilih tugas berikutnya…':'Siaga · bagi tugas tiap 30 mnt'}

let LAMA=false,HSEG='kerja';
// Daftar kerja dari roadmap.backlog: kelompok status supaya kelihatan mana selesai, jalan, pause
function ember(st){st=String(st||'').toLowerCase();
  if(/^selesai/.test(st))return 'selesai';
  if(/^(spesifikasi )?siap dikerjakan/.test(st))return 'belum';
  if(/founder|menunggu keputusan|draft siap dicek|deploy server manual/.test(st))return 'kamu';
  if(/sedang|berjalan|dikerjakan tim|diproses/.test(st))return 'jalan';
  return 'belum'}
const EMB={jalan:['⏳ Sedang dikerjakan','t-lav'],kamu:['❓ Tunggu keputusanmu (ide)','t-sun'],belum:['⏸️ Belum / pause',''],selesai:['✅ Selesai','t-mint']};
let BKF='';
function daftarKerja(){
  const B=(HQ&&HQ.roadmap&&HQ.roadmap.backlog)||[];if(!B.length)return '';
  const JL={};((HQ&&HQ.tasks)||[]).forEach(t=>{const m=String(t.judul||'').match(/^\[peta (\d+)\]/);if(m&&t.terbuka&&!/gagal|ditolak/.test(t.status))JL[m[1]]=t.n});
  const xs=B.map(b=>{const m=String(b.nama).match(/#(\d+)/g)||[];const jl=JL[b.no]&&!/^selesai/i.test(b.status);return{...b,e:jl?'jalan':ember(b.status),jl:JL[b.no],iss:jl?JL[b.no]:m.length?+m[m.length-1].slice(1):0,judul:String(b.nama).replace(/\s*\((?:laporan\s*)?#[\d,#\s]+\)/g,'').trim()}}).sort((a,b)=>String(a.prioritas).localeCompare(String(b.prioritas))||a.no-b.no);
  const n=k=>xs.filter(x=>x.e===k).length;
  const baris=x=>`<div class="tile bk" style="padding:14px"><div class="row" style="flex-wrap:wrap;gap:6px"><span class="chip ${x.prioritas==='P0'?'t-coral':x.prioritas==='P1'?'t-sun':'o'}">${esc(x.prioritas||'')}</span>${TIM[x.peran]?chipP(x.peran):''}<span class="chip ${EMB[x.e][1]}">${EMB[x.e][0]}</span><span class="sp"></span>${x.iss?`<button class="chip o" onclick="detail(${x.iss})">#${x.iss} →</button>`:'<span class="mut sm">belum ada kartu</span>'}</div><b class="bkj" style="display:block;margin:8px 0 4px">${esc(x.judul)}</b><div class="mut sm">${/^(siap dikerjakan|spesifikasi siap dikerjakan|selesai)$/.test(x.status)?'':esc(x.status)+' · '}peta no. ${x.no}${x.dokumen?` · <a href="#" onclick="go('dokumen','${esc(x.dokumen)}');return false">dokumen</a>`:''}</div></div>`;
  const tile=k=>`<button class="chip ${EMB[k][1]} ${BKF===k?'on':''}" style="min-height:38px;padding:6px 12px;font-size:13px" onclick="BKF=BKF==='${k}'?'':'${k}';hasilKerja(true)">${EMB[k][0]} <b>${n(k)}</b></button>`;
  const aktif=BKF?xs.filter(x=>x.e===BKF):xs.filter(x=>x.e!=='selesai');
  const sel=xs.filter(x=>x.e==='selesai');
  return `<div class="sec"><h2>Daftar kerja</h2><span class="mut sm">${xs.length} fitur besar dari peta · tiap fitur bisa terdiri dari banyak kartu #</span></div>
  <div class="row" style="gap:8px">${['jalan','kamu','belum','selesai'].map(tile).join('')}</div>
  <div class="grid" style="margin-top:12px">${aktif.length?aktif.map(baris).join(''):'<div class="empty">Tidak ada.</div>'}</div>
  ${!BKF&&sel.length?`<details class="more"><summary>Lihat yang selesai (${sel.length})</summary><div class="grid" style="margin-top:10px">${sel.map(baris).join('')}</div></details>`:''}`;
}
async function hasilKerja(again){
  if(!again)skel();
  let L;try{L=await call('/hasil')}catch(e){V.innerHTML='<p class="err">'+esc(e.message)+'</p>';return}

  if(!HQ){try{await load()}catch(e){}}
  const stK=t=>t.status==='ditolak'?'gagal':t.status;
  const item=L.filter(t=>t.status!=='gagal'||t.laporan).map(t=>({...t,h:t.laporan?hasil([{dari:'agent',teks:t.laporan.teks,waktu:t.laporan.waktu}]):null,w:t.laporan?t.laporan.waktu:t.diubah}));
  const mas=(HQ&&HQ.masukan||[]).map(m=>{const nm=(m.teks.match(/\*\*\S+\s+([^*]+)\*\*/)||[])[1]||'Tester';return{masukan:1,nama:nm.trim(),w:m.waktu,poin:m.teks.split('\n').filter(l=>/^\s*-\s/.test(l)).map(l=>l.replace(/^\s*-\s*/,''))}});
  const per=['riset','desain','developer','marketing','pm'];
  const lv=item.filter(t=>t.status==='live').length, sp=item.filter(t=>t.status==='siap').length;
  let all=item.filter(x=>cocokP(x));
  if(Q)all=all.filter(x=>cocokQ(x,x.laporan?x.laporan.teks:''));
  all.sort((x,y)=>new Date(y.w)-new Date(x.w));
  const batas=Date.now()-7*864e5, nLama=all.filter(x=>new Date(x.w)<batas).length;
  if(!LAMA)all=all.filter(x=>new Date(x.w)>=batas);
  if(SF)all=all.filter(x=>stK(x)===SF);
  const hari=d=>new Date(d).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
  const grp=[];all.forEach(x=>{const h=hari(x.w);let g=grp.find(g=>g.h===h);if(!g)grp.push(g={h,xs:[]});g.xs.push(x)});
  const kartuM=x=>{
    {const u=UJI.find(u=>u.n===x.nama)||{e:'👥',c:'t-pink',d:'Tester'};
      return `<div class="tile hk"><div class="row"><span class="chip">${u.e} ${esc(x.nama)}</span><span class="mut sm">${esc(u.d)}</span></div><b style="display:block;margin:8px 0 4px">Masukan untuk tim</b><ul class="pts sm2">${x.poin.slice(0,3).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;}
  };
  // Evaluasi singkat dari 100 kartu terakhir: porsi tiap peran, live, gagal
  const tot=L.length||1, pr=k=>Math.round(L.filter(t=>t.peran===k).length/tot*100);
  const gg=L.filter(t=>t.status==='gagal').length;
  const B=(HQ&&HQ.roadmap&&HQ.roadmap.backlog)||[];
  const siapBangun=B.filter(x=>x.peran==='developer'&&ember(x.status)==='belum').length;
  const WR={developer:'#AEB8A0',riset:'#D7EFFF',desain:'#E9F056',pm:'#C9B8FF',marketing:'#F4C7C3'};
  const nDev=L.filter(t=>t.peran==='developer').length;
  const saran=siapBangun>=3&&pr('developer')<40?`Developer cuma ${pr('developer')}% kartu. ${siapBangun} fitur sudah siap dibangun.`:gg?`${gg} kartu gagal, dicoba ulang otomatis.`:'Seimbang. Tim jalan sesuai peta.';
  const seg=(k,l)=>`<button class="chip ${HSEG===k?'on':''}" style="min-height:40px;padding:6px 14px;font-size:14px" onclick="HSEG='${k}';hasilKerja(true)">${l}</button>`;
  const isi=HSEG==='kerja'?daftarKerja():HSEG==='tester'?(mas.length?`<div class="grid" style="margin-top:12px">${mas.slice().sort((x,y)=>new Date(y.w)-new Date(x.w)).map(kartuM).join('')}</div>`:'<div class="empty">Belum ada masukan tester.</div>'):`
  <div style="margin-top:14px">${alatTugas(()=>hasilKerja(true),false)}</div>
  ${grp.length?grp.map(g=>`<div class="sec"><h2 style="font-size:20px">${esc(g.h)}</h2></div><div class="grid">${g.xs.map(x=>kartuTugas(x,{laporan:true})).join('')}</div>`).join(''):'<div class="empty">Belum ada hasil 7 hari terakhir.</div>'}${nLama?`<div style="margin:14px 0"><button class="btn ghost more-btn" style="width:100%" onclick="LAMA=!LAMA;hasilKerja(true)">${LAMA?'Lipat yang lama':'Tampilkan lebih lama ('+nLama+')'}</button></div>`:''}`;
  V.innerHTML=`
  <div style="margin-bottom:14px"><div class="eyebrow mut">Arsip & laporan tim</div><h1>Hasil kerja</h1></div>
  <div class="tile evl">
    <div class="evs">
      <div><div class="eyebrow">Live</div><div class="big">${lv}</div></div>
      <div style="cursor:pointer" onclick="keSiap()"><div class="eyebrow">Menunggu kamu</div><div class="big">${sp}</div></div>
      <div><div class="eyebrow">Gagal</div><div class="big">${gg}</div></div>
      <div><div class="eyebrow">Siap dibangun</div><div class="big">${siapBangun}</div></div>
    </div>
    <div class="eyebrow" style="margin-top:14px">Porsi kerja · ${L.length} kartu terakhir</div>
    <div class="evbar">${per.map(k=>pr(k)?`<i style="width:${pr(k)}%;background:${WR[k]}" title="${TIM[k].n} ${pr(k)}%"></i>`:'').join('')}</div>
    <div class="row sm" style="flex-wrap:wrap;gap:4px 12px;margin-top:6px">${per.map(k=>`<span>${TIM[k].e} ${TIM[k].n} <b>${pr(k)}%</b></span>`).join('')}</div>
    <div style="margin-top:10px;font-weight:700">${esc(saran)}</div>
  </div>
  <div class="row" style="margin:16px 0 4px;flex-wrap:wrap;gap:8px">${seg('kerja','Daftar kerja')}${seg('baru','Hasil terbaru')}${seg('tester','Masukan tester '+mas.length)}</div>
  ${isi}`;
  if($('#qt'))pasangAlat(()=>hasilKerja(true));
  clearTimeout(timer);timer=setTimeout(()=>{if(cur==='hasil'&&!(document.activeElement&&document.activeElement.id==='qt'))hasilKerja(true)},30000);
}

// Cari, saring, urutkan tugas (dipakai Papan & Hasil)
let Q='',PF='semua',SF='',SORT='baru';
const STAT=[['antre','Antre'],['dikerjakan','Dikerjakan'],['siap','Siap dicek'],['menuju','Menuju live'],['live','Live'],['gagal','Gagal / ditolak']];
const cocokQ=(t,extra)=>!Q||(String(t.judul||'')+' #'+t.n+' '+(extra||'')).toLowerCase().includes(Q.toLowerCase().trim());
const cocokP=t=>PF==='semua'||(PF==='kamu'?!t.otomatis:t.peran===PF);
const urutT=(L,key)=>{key=key||(t=>t.diubah);return [...L].sort(SORT==='lama'?(a,b)=>new Date(key(a))-new Date(key(b)):SORT==='nomor'?(a,b)=>b.n-a.n:(a,b)=>new Date(key(b))-new Date(key(a)))};
// Bar alat: cari + urutkan + chip peran. ulang() = render ulang halaman, fokus tetap di kotak cari.
function alatTugas(ulang,denganSort){
  const per=['riset','desain','developer','marketing','pm'];
  const ch=(k,l)=>`<button class="chip ${PF===k?'on':''}" data-pf="${k}">${l}</button>`;
  return `<div class="tb"><input id="qt" type="search" placeholder="Cari judul atau #nomor…" aria-label="Cari tugas" value="${esc(Q)}">${denganSort?`<select id="srt" aria-label="Urutkan"><option value="baru" ${SORT==='baru'?'selected':''}>Terbaru</option><option value="lama" ${SORT==='lama'?'selected':''}>Terlama</option><option value="nomor" ${SORT==='nomor'?'selected':''}>Nomor tugas</option></select>`:''}</div>
  <div class="row hf" style="margin:10px 0 14px;flex-wrap:wrap;gap:8px">${ch('semua','Semua')}${ch('kamu','✍️ Dari kamu')}${per.map(k=>ch(k,TIM[k].e+' '+TIM[k].n)).join('')}</div>
  <div class="row hf" style="margin:0 0 14px;flex-wrap:wrap;gap:8px"><button class="chip ${SF===''?'on':''}" data-sf="">Semua status</button>${STAT.map(([k,l])=>`<button class="chip ${SF===k?'on':''}" data-sf="${k}">${l}</button>`).join('')}</div>`;
}
function pasangAlat(ulang){
  const q=$('#qt');if(q){q.oninput=()=>{Q=q.value;ulang();const n=$('#qt');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
  const s=$('#srt');if(s)s.onchange=()=>{SORT=s.value;ulang()};
  V.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{PF=b.dataset.pf;ulang()});
  V.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{SF=b.dataset.sf;ulang()});
}

    <div class="tile c t-blue sumt" style="min-width:170px"><div class="eyebrow">Menunggu publish</div><div class="big">${menunggu.length}</div><div class="sm">${esc(ada(menunggu))} · butuh keputusanmu</div></div>

function hasil(riwayat){
  const m=[...riwayat].reverse().find(x=>x.dari==='agent'&&/Siap dicek|tidak mengubah/i.test(x.teks));
  if(!m)return null;
  const [ring,qa='']=m.teks.replace(/^\*\*[^*]+\*\*\s*/,'').split(/\n-{3,}\n/);
  const bul=s=>s.split('\n').filter(l=>/^\s*[-*•]\s+/.test(l)).map(l=>l.replace(/^\s*[-*•]\s+/,'').trim());
  let poin=bul(ring);if(!poin.length)poin=ring.split('\n').map(x=>x.replace(/^#+\s*/,'').trim()).filter(x=>x&&!/^ringkasan/i.test(x));
  const isTugas=x=>/^(\*\*)?(langkah (anda|kamu)|tugas kamu|yang perlu kamu|cara cek)/i.test(x);
  const qaL=qa.split('\n').map(x=>x.trim()).filter(Boolean);
  return {poin:poin.filter(x=>!isTugas(x)),tugas:poin.filter(isTugas).map(x=>x.replace(/^(\*\*)?(langkah (anda|kamu)|tugas kamu|yang perlu kamu)\s*:?\s*(\*\*)?\s*:?\s*/i,'')),
    qaOk:/lolos/i.test(qaL[0]||''),qaAda:!!qaL.length,qa:bul(qa),waktu:m.waktu};
}

/* Lampiran gambar (maks 3): tombol + tempel; dikecilkan di browser (sisi ≤1280px, JPEG 0,8) */
function kecilkan(f){return new Promise(ok=>{
  if(!f||!/^image\/(jpeg|png|webp)$/i.test(f.type))return ok('');
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{try{
    const k=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    let q=.8,d=c.toDataURL('image/jpeg',q);
    while(d.length>520000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}
    ok(d)}catch(e){ok('')}URL.revokeObjectURL(u)};
  im.onerror=()=>{URL.revokeObjectURL(u);ok('')};im.src=u})}

  const ths=kotak.querySelector('.ths'),inp=kotak.querySelector('input'),add=kotak.querySelector('[data-add]');
  const gambar=()=>{ths.innerHTML=L.map((u,i)=>`<span class="th"><img src="${u}" alt="Gambar ${i+1}"><button type="button" data-x="${i}" aria-label="Hapus gambar ${i+1}">×</button></span>`).join('');
    ths.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.x,1);gambar()});add.hidden=L.length>=3};
  const tambah=async fs=>{for(const f of fs){if(L.length>=3)break;const d=await kecilkan(f);if(d)L.push(d);else alert('Hanya foto/tangkapan layar (JPEG, PNG, WebP) ya.')}gambar()};
  add.onclick=()=>inp.click();inp.onchange=()=>{tambah([...inp.files]);inp.value=''};
  area.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();tambah(fs)}});
  return L}

name: Keepo Agent PM
run-name: "PM · ${{ inputs.peran || 'bebas' }}"

# Tiap hari jam 08.00 WIB, PM agent memilih 1 tugas berikutnya dari roadmap,
# membuat issue, lalu menyerahkannya ke agent kerja.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      paksa:
        description: Tetap jalan walau masih ada tugas menunggu
        type: boolean
        default: false
      peran:
        description: Wajib pilih tugas untuk peran ini (kosong = bebas)
        type: choice
        options: ['', riset, desain, developer, pm]
        default: ''
      fokus:
        description: Arahan fokus dari founder (opsional)
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: kepo-pm-${{ inputs.peran || 'bebas' }}
  cancel-in-progress: false

jobs:
  pm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek antrean
        id: cek
        run: |
          OPEN=$(gh issue list --label kepo-dev --state open --json number --jq length)
          echo "Tugas terbuka: $OPEN"
          if [ "$OPEN" -ge 5 ] && [ "${{ inputs.paksa }}" != "true" ]; then
            echo "Masih ada $OPEN tugas menunggu founder. PM istirahat hari ini."
            echo "jalan=0" >> "$GITHUB_OUTPUT"
          else
            echo "jalan=1" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p .kepo-tmp
          gh issue list --label kepo-dev --state all --limit 30 --json number,title,state,labels \
            --jq '.[] | "#\(.number) [\(.state)] [\([.labels[].name]|join(","))] \(.title)"' > ".kepo-tmp/tugas.txt"
          M=$(gh issue list --label masukan-pengguna --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$M" ]; then
            gh issue view "$M" --json comments --jq '[.comments[-8:][] | .body] | join("\n---\n")' > ".kepo-tmp/masukan.txt" || true
          fi

      - name: PM agent merencanakan
        if: steps.cek.outputs.jalan == '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            ${{ inputs.peran && format('WAJIB: tugas kali ini untuk peran "{0}" (abaikan aturan seimbang; peran lain sedang diberi tugas paralel, jadi pilih hal yang tidak tumpang tindih). Jangan lewati.', inputs.peran) || '' }}
            ${{ inputs.fokus && format('ARAHAN FOUNDER (utamakan): {0}', inputs.fokus) || '' }}
            Kamu agent PM tim Keepo. Baca CLAUDE.md, docs/TIM.md, docs/roadmap.json, dokumen lain di docs/, dan daftar tugas .kepo-tmp/tugas.txt (jangan duplikat tugas yang sudah ada/selesai/ditolak).
            Pilih SATU tugas berikutnya yang paling berdampak, sesuai fase sekarang, prioritas P0 dulu, prinsip "Reader First, AI Second", dan kapasitas founder 1-4 jam/minggu.
            Aturan seimbang: lihat 3 tugas berlabel otomatis terakhir di tugas.txt; jika belum ada yang berupa upgrade aplikasi, tugas kali ini WAJIB upgrade aplikasi (peran developer, atau desain yang mengubah style.css/ui.js). Untuk upgrade app, baca kode (index.html, app.js, ui.js, style.css), cari perbaikan nyata pada P0: kenyamanan membaca & bantuan memahami kata.
            Baca juga .kepo-tmp/masukan.txt (bila ada): masukan terbaru dari 2 tester AI & 2 pengguna AI. Masalah nyata yang berulang/berat dari mereka layak jadi tugas upgrade app; sebut nama mereka di "alasan".
            Batas antrean sekarang 5 tugas menunggu (bukan 2); jangan lewati hanya karena ada 2-4 tugas menunggu.
            Tugas harus bisa diselesaikan agent dalam satu kali kerja (kecil, jelas). Untuk hal yang butuh manusia (wawancara, rekrut beta), buat tugas menyiapkan bahannya.
            Tulis HANYA file .kepo-tmp/tugas.json berisi JSON:
            {"peran":"developer|riset|desain|pm","judul":"<maks 70 karakter>","isi":"<instruksi jelas untuk agent, Bahasa Indonesia>","alasan":"<1-2 kalimat kenapa ini sekarang, untuk founder>"}
            Jika TIDAK ada tugas baru yang layak (mis. bahan sudah lengkap dan menunggu founder), tulis {"lewati":true,"alasan":"<1 kalimat>"} ke file yang sama.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Write"

      - name: Buat tugas & serahkan
        if: steps.cek.outputs.jalan == '1'
        run: |
          F=".kepo-tmp/tugas.json"
          if [ ! -s "$F" ] || [ "$(jq -r '.lewati // false' "$F" 2>/dev/null)" = "true" ]; then
            A=$(jq -r '.alasan // "tidak ada tugas baru yang layak"' "$F" 2>/dev/null || echo "tidak ada tugas baru")
            echo "::notice title=PM istirahat::$A"; echo "PM istirahat: $A" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          PERAN=$(jq -r .peran "$F"); [ -n "${{ inputs.peran }}" ] && PERAN="${{ inputs.peran }}"; case "$PERAN" in developer|riset|desain|pm) ;; *) PERAN=developer ;; esac
          gh label create "peran:$PERAN" --color C9B8FF 2>/dev/null || true
          gh label create otomatis --color 9CC8FF 2>/dev/null || true
          jq -r '.isi + "\n\n---\n_Dipilih PM agent: " + .alasan + "_"' "$F" > ".kepo-tmp/body.md"
          URL=$(gh issue create --title "$(jq -r .judul "$F")" --body-file ".kepo-tmp/body.md" --label kepo-dev --label "peran:$PERAN" --label otomatis)
          N=${URL##*/}
          echo "Tugas baru: $URL"
          gh workflow run kepo-dev.yml -f issue="$N"

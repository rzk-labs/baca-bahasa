name: Keepo Agent Kerja

# Mengerjakan satu tugas (issue berlabel "kepo-dev") sesuai perannya, lalu QA agent memeriksa.
# Dipicu oleh:
# - issue baru dari founder (web Keepo HQ)
# - komentar "Revisi: ..." dari founder
# - workflow_dispatch (dipanggil PM agent atau tombol di web)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Nomor issue tugas
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: kepo-dev-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  kerja:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.sender.login == 'rzk-labs' &&
        contains(github.event.issue.labels.*.name, 'kepo-dev') &&
        github.event.issue.pull_request == null &&
        (github.event_name == 'issues' || startsWith(github.event.comment.body, 'Revisi:'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      N: ${{ github.event.issue.number || inputs.issue }}
      BR: kepo/issue-${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ambil tugas & siapkan branch
        env:
          REVISI: ${{ github.event.comment.body }}
        run: |
          git config user.name "Keepo Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for l in sedang-dikerjakan:FBCA04 siap-dicek:0E8A16 gagal:D93F0B qa-lolos:0E8A16 qa-catatan:FBCA04; do
            gh label create "${l%%:*}" --color "${l##*:}" 2>/dev/null || true
          done
          T=.kepo-tmp; mkdir -p $T; echo ".kepo-tmp/" >> .git/info/exclude
          gh issue view "$N" --json title --jq .title > "$T/judul.txt"
          gh issue view "$N" --json body --jq .body > "$T/isi.txt"
          PERAN=$(gh issue view "$N" --json labels --jq '[.labels[].name|select(startswith("peran:"))][0] // "peran:developer"' | sed 's/peran://')
          echo "PERAN=$PERAN" >> "$GITHUB_ENV"
          printf '%s' "$REVISI" > "$T/revisi.txt"
          M=$(gh issue list --label masukan-pengguna --state open --limit 1 --json number --jq '.[0].number // empty')
          [ -n "$M" ] && gh issue view "$M" --json comments --jq '[.comments[-12:][] | .body] | join("\n---\n")' > "$T/masukan.txt" || true
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null; then
            git checkout -B "$BR" "origin/$BR"
            # Selaraskan dengan main; bila bentrok, agent yang menyelesaikan tanda konflik.
            if ! git merge origin/main --no-edit -q; then
              git diff --name-only --diff-filter=U > "$T/konflik.txt"
            fi
          else
            git checkout -b "$BR"
          fi
          gh issue edit "$N" --add-label sedang-dikerjakan --remove-label siap-dicek --remove-label gagal --remove-label qa-lolos --remove-label qa-catatan || true

      - name: Tulis instruksi peran
        run: |
          T=.kepo-tmp
          case "$PERAN" in
            riset)  PERAN_TXT="Kamu agent RISET tim Keepo. Hasil kerjamu berupa dokumen riset di docs/riset-<topik>.md (Bahasa Indonesia, ringkas, ada kesimpulan & langkah berikutnya). Jangan ubah kode aplikasi. Kalau hasilnya mengubah status tahap/milestone, perbarui docs/roadmap.json." ;;
            desain) PERAN_TXT="Kamu agent DESAIN (UX/UI & brand) tim Keepo. Hasil kerjamu berupa dokumen docs/desain-<topik>.md dan/atau perubahan kecil di style.css/ui.js bila diminta. Ikuti BRAND.md." ;;
            pm)     PERAN_TXT="Kamu agent PM tim Keepo. Hasil kerjamu berupa dokumen perencanaan di docs/ dan pembaruan docs/roadmap.json. Jangan ubah kode aplikasi." ;;
            *)      PERAN_TXT="Kamu agent DEVELOPER tim Keepo. Kerjakan permintaan dengan mengubah kode aplikasi seperlunya." ;;
          esac
          {
            echo "$PERAN_TXT"
            echo "Baca CLAUDE.md, docs/TIM.md, dan docs/roadmap.json dulu untuk konteks."
            echo "Masukan terbaru dari tester AI (Tari, Bima) & pengguna AI (Nadia, Raka) ada di .kepo-tmp/masukan.txt; pakai bila relevan."
            echo ""
            echo "## Tugas #$N: $(cat $T/judul.txt)"
            cat "$T/isi.txt"
            if [ -s "$T/revisi.txt" ]; then
              echo ""
              echo "## REVISI TERBARU dari founder (prioritaskan; hasil sebelumnya sudah ada di branch ini)"
              cat "$T/revisi.txt"
            fi
            if [ -s "$T/konflik.txt" ]; then
              echo ""
              echo "## WAJIB DULU: bentrok dengan versi terbaru"
              echo "File berikut berisi tanda konflik (<<<<<<< ======= >>>>>>>). Gabungkan: pertahankan perubahan dari main DAN perubahan tugas ini, hapus semua tanda konflik, lalu naikkan versi C di sw.js melebihi versi di main."
              cat "$T/konflik.txt"
            fi
            echo ""
            echo "## Aturan"
            echo "- Ubah file seperlunya. Jangan git commit/push, jangan buat PR: workflow yang mengurusnya."
            echo "- Cek sintaks JS yang kamu ubah dengan node --check. Kalau mengubah file app yang di-cache, naikkan versi C di sw.js."
            echo "- Terakhir, tulis .kepo-ringkasan.md untuk founder (non-teknis, ADHD). Format WAJIB: maksimal 3 baris poin '- ...', tiap poin maksimal 15 kata, bahasa sehari-hari, tanpa nama file/istilah teknis. Jika founder perlu melakukan sesuatu, tambah SATU poin terakhir diawali 'Langkah kamu:' (maks 20 kata). Tanpa judul, tanpa paragraf. Kalau tugas tidak bisa dikerjakan, jangan ubah apa pun dan tulis 1 poin alasannya."
            echo "- Dokumen di docs/ untuk founder juga harus mudah dipindai (ADHD): mulai dengan bagian '## Intinya' berisi 3 poin, lalu bagian bernomor dengan judul ##, poin pendek, tanpa paragraf panjang."
          } > "$T/prompt.md"
          echo "PROMPT_FILE=$T/prompt.md" >> "$GITHUB_ENV"

      - name: Agent mengerjakan
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: Baca file ${{ env.PROMPT_FILE }} lalu kerjakan instruksinya.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(git diff:*),Bash(git status:*)"

      - name: Commit, push, PR
        id: pr
        run: |
          T=.kepo-tmp
          RINGKASAN="Agent selesai, tapi tidak menulis ringkasan."
          if [ -f .kepo-ringkasan.md ]; then RINGKASAN="$(cat .kepo-ringkasan.md)"; rm .kepo-ringkasan.md; fi
          printf '%s' "$RINGKASAN" > "$T/ringkasan.md"
          git checkout -- .github 2>/dev/null || true   # agent tidak boleh mengubah workflow
          # Pastikan versi cache lebih tinggi dari main bila file app berubah
          MC=$(git show origin/main:sw.js | grep -o "kepo-v[0-9]*" | head -1 | tr -dc 0-9)
          BC=$(grep -o "kepo-v[0-9]*" sw.js | head -1 | tr -dc 0-9)
          if git diff --name-only origin/main -- index.html app.js ui.js style.css cloud.js img | grep -q . && [ "$BC" -le "$MC" ]; then
            sed -i "s/kepo-v$BC'/kepo-v$((MC+1))'/" sw.js
          fi
          git add -A
          git diff --cached --quiet || git commit -m "Keepo #$N ($PERAN): $(cat $T/judul.txt)"
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            gh issue comment "$N" --body-file <(printf '**Agent tidak mengubah apa pun.**\n\n%s' "$RINGKASAN")
            gh issue edit "$N" --add-label gagal --remove-label sedang-dikerjakan
            echo "ada=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -u origin "$BR"
          PR=$(gh pr list --head "$BR" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --head "$BR" --base main --title "Keepo #$N ($PERAN): $(cat $T/judul.txt)" --body-file <(printf 'Closes #%s\n\n%s' "$N" "$RINGKASAN")
          fi
          git diff origin/main...HEAD > "$T/diff.patch"
          echo "ada=1" >> "$GITHUB_OUTPUT"

      - name: QA agent memeriksa
        if: steps.pr.outputs.ada == '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            Kamu agent QA tim Keepo. Periksa hasil kerja agent untuk tugas berikut (jangan mengubah file apa pun selain menulis laporan).
            Tugas: lihat .kepo-tmp/judul.txt dan .kepo-tmp/isi.txt (revisi, bila ada: .kepo-tmp/revisi.txt).
            Perubahan: .kepo-tmp/diff.patch. Baca file terkait di repo seperlunya.
            Cek: (1) sesuai permintaan, (2) node --check untuk tiap file .js yang berubah, (3) risiko merusak data pengguna/fitur lain, (4) tampilan HP, (5) versi C di sw.js naik bila file app berubah.
            Tulis laporan ke .kepo-tmp/qa.md. Baris pertama HARUS persis "LOLOS" atau "CATATAN". Lalu maksimal 3 poin '- ...', tiap poin maksimal 15 kata, bahasa sehari-hari untuk founder non-teknis (ADHD). Tulis hanya hal yang penting diketahui founder.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(node:*),Bash(git diff:*),Bash(ls:*),Bash(cat:*)"

      - name: Laporkan
        if: steps.pr.outputs.ada == '1'
        run: |
          T=.kepo-tmp
          git checkout -- . 2>/dev/null || true
          if [ -f "$T/qa.md" ]; then
            V=$(head -1 "$T/qa.md" | tr -d '\r *#' )
            QA=$(tail -n +2 "$T/qa.md")
          else
            V=CATATAN; QA="QA agent tidak menulis laporan."
          fi
          if [ "$V" = "LOLOS" ]; then L=qa-lolos; H="✅ QA lolos"; else L=qa-catatan; H="⚠️ QA ada catatan"; fi
          gh issue comment "$N" --body-file <(printf '**Siap dicek.**\n\n%s\n\n---\n**%s**\n%s' "$(cat $T/ringkasan.md)" "$H" "$QA")
          # Auto-setujui SEMUA hasil (permintaan founder): langsung masuk antrean live.
          # Catatan QA tetap tersimpan di komentar; founder bisa Revisi/Tolak setelah live.
          gh label create antre-live --color 7DD3FC 2>/dev/null || true
          gh issue edit "$N" --add-label antre-live --add-label "$L" --remove-label sedang-dikerjakan
          gh issue comment "$N" --body "🚀 **Otomatis disetujui** ($H), masuk antrean live."
          gh workflow run kepo-gabung.yml

      - name: Tandai gagal
        if: failure()
        run: |
          gh issue comment "$N" --body "**Agent gagal.** Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$N" --add-label gagal --remove-label sedang-dikerjakan

      - name: Jaga tim tetap sibuk
        if: always()
        run: gh workflow run kepo-jaga.yml || true

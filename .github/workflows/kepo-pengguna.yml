name: Keepo Pengguna & Tester AI

# Tiap 2 jam: 2 tester AI + 4 pengguna AI (+1 pengguna HQ) mencoba Keepo
# (dengan membaca kode aplikasi live di main) lalu menulis masukan di issue "Masukan pengguna AI".
# PM membaca masukan ini saat memilih tugas.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      setelah_live:
        description: Dipicu setelah ada update live (dilewati bila baru jalan <40 menit)
        type: boolean
        default: false

concurrency:
  group: kepo-pengguna
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  siapkan:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.i.outputs.n }}
      jalan: ${{ steps.i.outputs.jalan }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: i
        run: |
          gh label create masukan-pengguna --color F2A6C8 2>/dev/null || true
          N=$(gh issue list --label masukan-pengguna --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            URL=$(gh issue create --title "Masukan pengguna AI" --label masukan-pengguna \
              --body "Tiap 2 jam 2 tester AI + 4 pengguna AI mencoba Keepo dan menulis masukan di sini. PM membacanya.")
            N=${URL##*/}
          fi
          echo "n=$N" >> "$GITHUB_OUTPUT"
          J=1
          if [ "${{ inputs.setelah_live }}" = "true" ]; then
            T=$(gh api "repos/$GH_REPO/issues/$N" --jq ".updated_at // empty")
            if [ -n "$T" ] && [ $(( $(date +%s) - $(date -d "$T" +%s) )) -lt 2400 ]; then J=0; echo "Baru dicoba <40 menit lalu, lewati."; fi
          fi
          echo "jalan=$J" >> "$GITHUB_OUTPUT"

  coba:
    needs: siapkan
    if: needs.siapkan.outputs.jalan == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nama: Tari
            ikon: "🔍"
            jenis: tester
            profil: "Tester AI. Fokus: tampilan & pemakaian di HP kecil (iPhone Safari): tombol terlalu kecil, teks terpotong, tata letak rusak, alur membingungkan."
          - nama: Bima
            ikon: "🧪"
            jenis: tester
            profil: "Tester AI. Fokus: keandalan: impor .txt/.epub/.pdf, terjemahan gagal, mode offline, data/progres hilang, error JavaScript."
          - nama: Nadia
            ikon: "📖"
            jenis: pengguna
            profil: "Pengguna AI. 20 tahun, mahasiswi Bandung, bahasa Inggris A2, ingin baca novel di HP sebelum tidur, gampang bosan & terdistraksi, tidak sabar dengan langkah ribet."
          - nama: Raka
            ikon: "💼"
            jenis: pengguna
            profil: "Pengguna AI. 24 tahun, karyawan Jakarta, belajar bahasa Korea/Jepang level B1, baca artikel & web novel saat di KRL, ingin cepat paham kata tanpa pindah aplikasi."
          - nama: Sinta
            ikon: "🧕"
            jenis: pengguna
            profil: "Pengguna AI. 31 tahun, ibu rumah tangga di Surabaya, belajar bahasa Mandarin untuk HSK 3, baca cerita pendek dan buku anak dua bahasa sambil menunggu anak tidur. Ingin kata yang sulit diingat bisa diulang lagi nanti, dan tidak mau pusing dengan pengaturan."
          - nama: Ilham
            ikon: "🎮"
            jenis: pengguna
            profil: "Pengguna AI. 17 tahun, siswa SMA di Makassar, ingin mengerti novel dan komik berbahasa Inggris tanpa harus buka kamus terus. Suka tantangan dan lencana, tapi cepat bosan kalau aplikasi terasa lambat atau banyak iklan teks."
          - nama: Dina
            ikon: "🗂️"
            jenis: hq
            profil: "Pemakai AI untuk Keepo HQ (web markas tim agent). Kamu founder solo yang sibuk dan ADHD: cuma punya 5 menit, ingin langsung tahu apa yang harus diputuskan. Fokus: teks meluber/terpotong, label/ikon tidak jelas, status membingungkan, terlalu banyak teks, tombol yang tidak jelas akibatnya, tampilan HP."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Pakai Keepo sungguhan (akun uji publik)
        env:
          KEEPO_BOT_KEY: ${{ secrets.KEEPO_BOT_KEY }}
          NAMA: ${{ matrix.nama }}
        run: |
          mkdir -p .kepo-tmp; echo ".kepo-tmp/" >> .git/info/exclude
          if [ -z "$KEEPO_BOT_KEY" ]; then echo "KEEPO_BOT_KEY belum diisi: lewati pemakaian nyata."; exit 0; fi
          npm i --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 \
            && node .github/scripts/pakai-keepo.mjs || echo "Pemakaian nyata gagal, lanjut ke penilaian kode."
      - name: Siapkan instruksi
        env:
          NAMA: ${{ matrix.nama }}
          JENIS: ${{ matrix.jenis }}
          PROFIL: ${{ matrix.profil }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .kepo-tmp; echo ".kepo-tmp/" >> .git/info/exclude
          gh issue view "${{ needs.siapkan.outputs.issue }}" --json comments \
            --jq '[.comments[-8:][] | .body] | join("\n---\n")' > .kepo-tmp/lalu.txt 2>/dev/null || true
          git log --since="6 hours ago" --pretty="- %s" origin/main 2>/dev/null | grep "Keepo #" | head -15 > .kepo-tmp/baru.txt || true
          gh issue list --label kepo-dev --state all --limit 40 --json number,title,state,stateReason,labels \
            --jq '.[] | "#\(.number) [\(.state) \(.stateReason // "")] [\([.labels[].name]|join(","))] \(.title)"' > .kepo-tmp/tugas.txt || true
          {
            echo "Kamu adalah $NAMA. $PROFIL"
            if [ "$JENIS" = hq ]; then
              echo "Yang kamu coba: Keepo HQ. Kodenya di dev/src/page.html (tampilan: Markas, Hasil, Papan, Peta, Dokumen, Detail tugas) dan dev/src/index.js (data dari GitHub)."
              echo "Data tugas nyata saat ini ada di .kepo-tmp/tugas.txt (label menentukan kolom/status). Bayangkan tampilannya dengan data itu, di laptop dan HP 390px."
              echo "Cari masalah NYATA yang bisa dibuktikan dari kode + data (sebut tampilan & bagian mana). Jangan mengarang."
            else
            echo "Aplikasi: Keepo, PWA belajar bahasa lewat membaca buku (live di https://rzk-labs.github.io/baca-bahasa/)."
            echo "Baca CLAUDE.md lalu 'coba' aplikasinya dengan membaca kodenya (index.html, ui.js, app.js, style.css) dan bayangkan memakainya sesuai profilmu."
            fi
            if [ "$JENIS" = tester ]; then
              echo "Cari masalah NYATA yang bisa dibuktikan dari kode (sebut di bagian mana). Jangan mengarang."
            else
              echo "Ceritakan pengalamanmu sebagai pengguna: apa yang bikin senang, bingung, atau bikin berhenti pakai."
            fi
            if [ -s .kepo-tmp/pakai.txt ]; then
              echo "Kamu BARU SAJA memakai Keepo sungguhan dengan akun ujimu (publik). Catatan sesi: .kepo-tmp/pakai.txt. Screenshot HP: .kepo-tmp/layar/*.png (buka dengan Read). Utamakan masalah yang kamu LIHAT di screenshot/catatan ini."
            fi
            echo "UPDATE TERBARU yang baru live (prioritaskan mencoba ini dulu): lihat .kepo-tmp/baru.txt. Kalau ada yang rusak/kurang dari update itu, laporkan."
            echo "Masukan hari-hari sebelumnya ada di .kepo-tmp/lalu.txt: JANGAN ulangi hal yang sama; cari hal baru."
            echo "Jangan ubah file apa pun. Tulis hanya .kepo-tmp/masukan.md: maksimal 3 poin '- ...', tiap poin maks 20 kata, bahasa sehari-hari, urut dari paling penting. Tanpa judul."
          } > .kepo-tmp/prompt.md
      - name: Mencoba aplikasi
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: Baca file .kepo-tmp/prompt.md lalu kerjakan instruksinya.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Write"
      - name: Kirim masukan
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s .kepo-tmp/masukan.md ] || exit 0
          case "${{ matrix.jenis }}" in tester) L="Tester AI";; hq) L="Pengguna Keepo HQ";; *) L="Pengguna AI";; esac
          gh issue comment "${{ needs.siapkan.outputs.issue }}" --body-file <(printf '**%s %s** (%s) · %s\n\n%s' \
            "${{ matrix.ikon }}" "${{ matrix.nama }}" "$L" "$(TZ=Asia/Jakarta date +%d-%m-%Y)" "$(cat .kepo-tmp/masukan.md)")

name: Keepo Jaga Tim

# Memastikan tidak ada anggota tim yang menganggur.
# Tiap 30 menit (dan setiap kali tugas selesai): untuk tiap peran yang sedang kosong,
# minta PM memberi tugas baru khusus peran itu.
# Rem: berhenti bila >= 6 hasil menunggu founder; kuota harian per peran. Ada pekerjaan "belum" di peta + peran kosong = langsung diberi tugas.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: kepo-jaga
  cancel-in-progress: false

jobs:
  jaga:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cek & isi peran yang kosong
        run: |
          TUNGGU=$(gh issue list --label kepo-dev --label siap-dicek --state open --json number --jq length)
          echo "Menunggu founder: $TUNGGU"
          if [ "$TUNGGU" -ge 6 ]; then
            echo "::notice title=Tim menunggu kamu::$TUNGGU hasil menunggu dicek. Tim tidak diberi tugas baru dulu."; exit 0
          fi
          # Kartu yang sudah live tapi masih terbuka: tutup.
          for N in $(gh issue list --label kepo-dev --label live --state open --json number --jq '.[].number'); do
            gh issue close "$N" && echo "#$N live → ditutup"
          done
          # Coba ulang tugas gagal: maks 2x per tugas, 3 tugas per putaran. Tugas brand lama (A/v8) dilewati.
          for N in $(gh issue list --label kepo-dev --label gagal --state open --limit 40 --json number,title,labels \
              --jq '[.[]|select(([.labels[].name]|index("ulang-2"))|not)|select(.title|test("brand A";"i")|not)]|.[:3][]|.number'); do
            L=$(gh issue view "$N" --json labels --jq 'if ([.labels[].name]|index("ulang-1")) then "ulang-2" else "ulang-1" end')
            gh label create "$L" --color BFD4F2 2>/dev/null || true
            gh issue edit "$N" --add-label "$L" --remove-label gagal
            gh issue comment "$N" --body "🔁 Dicoba ulang otomatis ($L dari 2)."
            gh workflow run kepo-dev.yml -f issue="$N"
            echo "#$N gagal → dicoba ulang ($L)"
          done
          HARI=$(date -u +%Y-%m-%d)
          PMRUN=$(gh run list --workflow kepo-pm.yml --limit 20 --json status,displayTitle \
            --jq '[.[]|select(.status!="completed")|.displayTitle]|join(" ")')
          # Kuota per peran: developer (yang mengubah app) paling banyak; peran dokumen dibatasi.
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/roadmap.json" -H "Accept: application/vnd.github.raw" > /tmp/peta.json 2>/dev/null || echo '{"backlog":[]}' > /tmp/peta.json
          # Pekerjaan berstatus belum per peran (bukan selesai, bukan menunggu keputusan)
          belum() { jq --arg p "$1" '[.backlog[]|select(.peran==$p)|select(.status|test("^selesai";"i")|not)|select((.status|test("^(spesifikasi )?siap dikerjakan";"i")) or (.status|test("founder|menunggu keputusan|deploy server manual|draft siap dicek";"i")|not))]|length' /tmp/peta.json 2>/dev/null || echo 0; }
          SIAP=$(belum developer); SIAP=${SIAP:-0}; echo "Fitur developer siap dibangun: $SIAP"
          for P in developer desain riset pm marketing; do
            case "$P" in developer) KUOTA=64;; desain) KUOTA=8;; riset|pm) KUOTA=6;; *) KUOTA=4;; esac
            PUNYA=$(belum "$P"); PUNYA=${PUNYA:-0}
            # Peran dokumen direm saat developer kebanjiran, KECUALI peran itu masih punya pekerjaan "belum" di peta.
            if [ "$P" != developer ] && [ "$P" != marketing ] && [ "$SIAP" -ge 5 ] && [ "$PUNYA" -eq 0 ]; then echo "$P: rem, $SIAP fitur menunggu developer"; continue; fi
            # Developer boleh 2 tugas paralel bila antrean peta masih banyak, supaya cepat beres.
            MAKS=1; if [ "$P" = developer ] && [ "$SIAP" -ge 3 ]; then MAKS=2; fi
            SIBUK=$(gh issue list --label kepo-dev --label "peran:$P" --state open --json labels \
              --jq '[.[]|select([.labels[].name]|(index("siap-dicek") or index("gagal"))|not)]|length')
            HARI_INI=$(gh issue list --label otomatis --label "peran:$P" --state all --limit 100 --json createdAt \
              --jq "[.[]|select(.createdAt|startswith(\"$HARI\"))]|length")
            if [ "$SIBUK" -ge "$MAKS" ]; then echo "$P: sibuk ($SIBUK/$MAKS tugas)"; continue; fi
            if echo "$PMRUN" | grep -qw "$P"; then echo "$P: PM sedang memilihkan tugas"; continue; fi
            if [ "$HARI_INI" -ge "$KUOTA" ]; then echo "$P: kuota harian tercapai ($HARI_INI/$KUOTA)"; continue; fi
            echo "$P: KOSONG → minta PM memberi tugas (peta belum: $PUNYA)"
            gh workflow run kepo-pm.yml -f paksa=true -f peran="$P"
          done

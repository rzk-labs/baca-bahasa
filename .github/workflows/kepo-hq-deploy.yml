name: Keepo HQ Deploy

# Saat perubahan Keepo HQ (dev/) masuk main, deploy otomatis ke Cloudflare Worker.
# Butuh secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"). Tanpa secret: dilewati.

on:
  push:
    branches: [main]
    paths: ['dev/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        working-directory: dev
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN belum ada; deploy dilewati."; exit 0; fi
          node --check src/index.js
          npx --yes wrangler@4 deploy
